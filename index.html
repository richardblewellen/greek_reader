{ id: 1011, english: "The whole city will honor the bravest leader.", greek: "πᾶσα ἡ πόλις τιμήσει τὸν ἀνδρειότατον ἡγεμόνα." },
{ id: 1012, english: "Socrates was the wisest of all men.", greek: "ὁ Σωκράτης πάντων σοφώτατος ἦν." },
{ id: 1013, english: "Good citizens will always honor Demosthenes.", greek: "οἱ ἀγαθοὶ πολῖται ἀεὶ τιμήσουσι τὸν Δημοσθένη." },
{ id: 1014, english: "Of all men the Greeks were the most free.", greek: "πάντων ἀνθρώπων οἱ Ἕλληνες ἐλευθερώτατοι ἦσαν." },
{ id: 1015, english: "Let him honor his country and his king.", greek: "τιμάτω τὴν πατρίδα καὶ τὸν βασιλέα." },
{ id: 1016, english: "The Greeks will easily conquer the army of the king.", greek: "οἱ Ἕλληνες ῥᾳδίως νικήσουσι τὴν τοῦ βασιλέως στρατίαν." },
{ id: 1017, english: "It will be most difficult to conquer the Persians.", greek: "χαλεπώτατον ἔσται νικᾶν τοὺς Πέρσας." },
{ id: 1018, english: "Those who conquer in war are honored by all.", greek: "οἱ ἐν πολέμῳ νικῶντες ὑπὸ πάντων τιμῶνται." },
{ id: 1019, english: "Let us not always honor the conquerors.", greek: "μὴ ἀεὶ τιμῶμεν τοὺς νενικηκότας." },
{ id: 1020, english: "May you always honor old men!", greek: "ἀεὶ τιμῴης τοὺς γέροντας." },
{ id: 1021, english: "May the king be always honored!", greek: "τιμῷτο ἀεὶ ὁ βασιλεύς." },
{ id: 1022, english: "Let us not be conquered by the Persians.", greek: "μὴ νικηθῶμεν ὑπὸ τῶν Περσῶν." },
{ id: 1023, english: "The Greeks will be conquered in three days.", greek: "οἱ Ἕλληνες τριῶν ἡμερῶν νικηθήσονται." },
{ id: 1024, english: "Those who are honored by the king are very rich.", greek: "οἱ ὑπὸ τοῦ βασιλέως τιμώμενοι πλουσιώτατοί εἰσιν." },
{ id: 1025, english: "Let the Greeks be honored by all.", greek: "τιμάσθων ὑπὸ πάντων οἱ Ἕλληνες." },
{ id: 1026, english: "It is pleasant to be honored by the many.", greek: "ἡδύ ἐστιν ὑπὸ τῶν πολλῶν τιμᾶσθαι." },
{ id: 1027, english: "There are many rich men in Greece.", greek: "ἄνθρωποι πολλοὶ καὶ πλούσιοί εἰσιν ἐν τῇ Ἑλλάδι." },
{ id: 1028, english: "The wisest men in the city will honor Demosthenes.", greek: "οἱ ἐν τῇ πόλει σοφώτατοι τιμήσουσι τὸν Δημοσθένη." },
{ id: 1029, english: "May we not be honored by the bad!", greek: "μὴ ὑπὸ τῶν κακῶν τιμῴμεθα." },
{ id: 1030, english: "The Persians were richer than the Greeks.", greek: "οἱ Πέρσαι πλουσιώτεροι ἦσαν τῶν Ἑλλήνων." },
{ id: 1031, english: "It will not be difficult to defeat the cavalry.", greek: "οὐ χαλεπὸν ἔσται νικᾶν τοὺς ἱππέας." },
{ id: 1032, english: "May the gods be honored by all!", greek: "εἴθε οἱ θεοὶ ὑπὸ πάντων τιμῷντο." },
{ id: 1033, english: "It is easy to be honored by the many.", greek: "ῥᾴδιόν ἐστιν ὑπὸ τῶν πολλῶν τιμᾶσθαι." },
{ id: 1034, english: "The teeth of the lions were large and sharp.", greek: "οἱ τῶν λεόντων ὀδόντες μεγάλοι καὶ ὀξεῖς ἦσαν." },
{ id: 1035, english: "Those who are honored by the citizens will not harm the city.", greek: "οἱ ὑπὸ τῶν πολιτῶν τιμώμενοι οὐ βλάψουσι τὴν πόλιν." },
{ id: 1036, english: "Do not write letters to the rich.", greek: "μὴ πρὸς τοὺς πλουσίους ἐπιστολὰς γράφε." },
{ id: 1037, english: "Oh, that Demosthenes may not be defeated in the battle!", greek: "εἴθε ὁ Δημοσθένης μὴ νικηθείη ἐν τῇ μάχῃ." },
{ id: 1038, english: "Do not defeat those who fight for their country.", greek: "μὴ νίκα τοὺς ὑπὲρ τῆς πατρίδος μαχομένους." },
{ id: 1039, english: "The rhetorician was honored by all the boys.", greek: "ὁ ῥήτωρ ὑπὸ πάντων τῶν παίδων ἐτιμᾶτο." },
{ id: 1040, english: "Do not trust those who are honored by the king.", greek: "μὴ πίστευε τοῖς ὑπὸ τοῦ βασιλέως τιμωμένοις." },
{ id: 1041, english: "The nobles on the island were very rich.", greek: "οἱ ἐν τῇ νήσῳ εὐγενεῖς πλουσιώτατοι ἦσαν." },
{ id: 1042, english: "Do not believe the words of the conquered.", greek: "μὴ πίστευε τοῖς τῶν νενικημένων λόγοις." },
{ id: 1043, english: "The soldiers were braver than the sailors.", greek: "οἱ στρατιῶται ἀνδρειότεροι ἦσαν τῶν ναυτῶν." },
{ id: 1044, english: "Do not pursue the Persians to their ships.", greek: "μὴ θηρεύσῃς τοὺς Πέρσας πρὸς τάς ναῦς." },
{ id: 1045, english: "The cavalry were easily defeated by the king.", greek: "οἱ ἱππῆς ῥᾳδίως ἐνικήθησαν ὑπὸ τοῦ βασιλέως." },
{ id: 1046, english: "The words of the orator will be honored by all.", greek: "οἱ τοῦ ῥήτορος λόγοι ὑπὸ πάντων τιμηθήσονται." },
{ id: 1047, english: "Socrates was wiser than Demosthenes.", greek: "ὁ Σωκράτης σοφώτερος ἦν τοῦ Δημοσθένους." },
{ id: 1048, english: "Those who are defeated are not honored by their conquerors.", greek: "οἱ νενικημένοι οὐ τιμῶνται ὑπὸ τῶν νενικηκότων." },
{ id: 1049, english: "We were honored by the bravest citizens.", greek: "ὑπὸ τῶν ἀνδρειοτάτων πολιτῶν ἐτιμήθημεν." },
{ id: 1050, english: "Every island will then be free.", greek: "πᾶσα νῆσος τότε ἐλευθέρα ἔσται." },
{ id: 1051, english: "Let us always love our benefactors.", greek: "ἀεὶ φιλῶμεν τοὺς εὖ πεποιηκότας." },
{ id: 1052, english: "Do not treat your slaves badly.", greek: "μὴ κακῶς πρᾶττε τοὺς δούλους." },
{ id: 1053, english: "Those who benefit their country are honored.", greek: "οἱ τὴν πατρίδα εὖ ποιοῦντες τιμῶνται." },
{ id: 1054, english: "We will carry on the war in winter.", greek: "τὸν πόλεμον τοῦ χειμῶνος ποιησόμεθα." },
{ id: 1055, english: "Do not believe those who are loved by the king.", greek: "μὴ πιστεύσῃς τοῖς ὑπὸ τοῦ βασιλέως φιλουμένοις." },
{ id: 1056, english: "The city is loved by the citizens.", greek: "ἡ πόλις φιλεῖται ὑπὸ τῶν πολιτῶν." },
{ id: 1057, english: "Every city was carrying on the war with much courage.", greek: "πᾶσα πόλις πολλῇ ἀρετῇ ἐποιεῖτο τὸν πόλεμον." },
{ id: 1058, english: "May we always honor the bravest soldiers!", greek: "ἀεὶ τιμῶμεν τοὺς ἀνδρειοτάτους στρατιώτας." },
{ id: 1059, english: "We do not trust those who are carrying on the war.", greek: "οὐ πιστεύομεν τοῖς τὸν πόλεμον ποιουμένοις." },
{ id: 1060, english: "Let us carry on the war against the king with much courage.", greek: "πολλῇ ἀρετῇ τὸν πόλεμον πρὸς τὸν βασιλέα ποιώμεθα." },
{ id: 1061, english: "The whole city was benefited by those who administered the affairs.", greek: "πᾶσα ἡ πόλις εὖ ἐποιήθη ὑπὸ τῶν τὰ πράγματα πραττόντων." },
{ id: 1062, english: "The gods will not harm those who benefit their country.", greek: "οἱ θεοὶ οὐ βλάψουσι τοὺς τὴν πατρίδα εὖ ποιοῦντας." },
{ id: 1063, english: "Do not love those who harm the city.", greek: "μὴ φίλει τοὺς τὴν πόλιν βλάπτοντας." },
{ id: 1064, english: "May they not carry on the war for many years!", greek: "μὴ τὸν πόλεμον πολλὰ ἔτη ποιοῖντο." },
{ id: 1065, english: "Oh that you may benefit your king and country!", greek: "τὸν βασιλέα καὶ τὴν πατρίδα εὖ ποιοίης." },
{ id: 1066, english: "Let us persuade the citizens to carry on the war with much courage.", greek: "πείσωμεν τοὺς πολίτας τὸν πόλεμον πολλῇ ἀρετῇ ποιεῖσθαι." },
{ id: 1067, english: "May he always love his father and mother.", greek: "ἀεὶ φιλείτω τὸν πατέρα καὶ τὴν μητέρα." },
{ id: 1068, english: "It is disgraceful to harm our benefactors.", greek: "αἰσχρόν ἐστι βλάπτειν τοὺς εὖ πεποιηκότας." },
{ id: 1069, english: "Do not trust those who persuaded the king to fight.", greek: "μὴ πιστεύσῃς τοῖς πείσασι τὸν βασιλέα μάχεσθαι." },
{ id: 1070, english: "The conquerors were richer than the conquered.", greek: "οἱ νενικηκότες πλουσιώτεροι ἦσαν τῶν νενικημένων." },
{ id: 1071, english: "It was disgraceful to fight against the benefactors.", greek: "αἰσχρὸν ἦν πρὸς τοὺς εὖ πεποιηκότας μάχεσθαι." },
{ id: 1072, english: "May we not treat badly those who saved the country!", greek: "μὴ κακῶς ποιῶμεν τοὺς τὴν πατρίδα σώσαντας." },
{ id: 1073, english: "Let us ransom those who have benefited the city.", greek: "λυώμεθα τοὺς τὴν πόλιν εὖ πεποιηκότας." },
{ id: 1074, english: "Do not love those who honor war.", greek: "μὴ φιλεῖτε τοὺς πόλεμον τιμῶντας." },
{ id: 1075, english: "The conquered are wiser than the conquerors.", greek: "οἱ νενικημένοι σοφώτεροί εἰσιν τῶν νενικηκότων." },
{ id: 1076, english: "All the cities of Greece were free for many years.", greek: "πᾶσαι αἱ τῆς Ἑλλάδος πόλεις πολλὰ ἔτη ἐλεύθεραι ἦσαν." },
{ id: 1077, english: "Let us carry on the war for six months.", greek: "τὸν πόλεμον ἓξ μῆνας ποιώμεθα." },
{ id: 1078, english: "Greece has not been benefited by the orators.", greek: "ἡ Ἑλλὰς οὐκ εὖ πεποίηται ὑπὸ ῥητόρων." },
{ id: 1079, english: "The sons of the free citizens were trained in wisdom.", greek: "οἱ τῶν ἐλευθέρων πολιτῶν παῖδες ἐν τῇ σοφίᾳ ἐπαιδεύθησαν." },
{ id: 1080, english: "Do not carry on the war in the winter, Citizens.", greek: "μὴ χειμῶνος ποιεῖσθε τὸν πόλεμον, ὦ πολῖται." },
{ id: 1081, english: "All the ships will be safer in the harbor in winter.", greek: "πᾶσαι αἱ νῆες χειμῶνος ἐν τῷ λιμένι ἀσφαλέστεραι ἔσονται." },
{ id: 1082, english: "Do not enslave the noblest citizens.", greek: "μὴ δουλώσῃς τοὺς εὐγενεστάτους πολίτας." },
{ id: 1083, english: "It is disgraceful to enslave those who fight for their country.", greek: "αἰσχρόν ἐστι δουλῶσαι τοὺς ὑπὲρ τῆς πατρίδος μαχομένους." },
{ id: 1084, english: "Most true were the words of the conquerors.", greek: "ἀληθέστατοι ἦσαν οἱ τῶν νενικηκότων λόγοι." },
{ id: 1085, english: "Those who enslaved Greece are not honored now.", greek: "οἱ τὴν Ἑλλάδα δουλώσαντες οὐ νῦν τιμῶνται." },
{ id: 1086, english: "May you always show courage in battle!", greek: "ἀεὶ τὴν ἀρετὴν ἐν μάχῃ δηλοίης." },
{ id: 1087, english: "It will be safest to trust the king's words.", greek: "ἀσφαλέστατον ἔσται πιστεύειν τοῖς βασιλέως λόγοις." },
{ id: 1088, english: "Let us not be enslaved by the Persians.", greek: "μὴ ὑπὸ τῶν Περσῶν δουλώμεθα." },
{ id: 1089, english: "Those who show courage are loved by boys.", greek: "οἱ τὴν ἀρετὴν δηλοῦντες ὑπὸ τῶν παίδων φιλοῦνται." },
{ id: 1090, english: "Let us not send presents to those who enslaved the city.", greek: "μὴ δῶρα πέμψωμεν πρὸς τοὺς τὴν πόλιν δουλώσαντας." },
{ id: 1091, english: "The conquerors will be more feree than those who are enslaved.", greek: "οἱ νενικηκότες ἐλευθερώτεροι ἔσονται τῶν δουλουμένων." },
{ id: 1092, english: "May we always show courage in war, Citizens.", greek: "ἀεὶ τὴν ἀρετὴν ἐν πολέμῳ δηλοῖμεν, ὦ πολῖται." },
{ id: 1093, english: "It will be safer to carry on the war in spring.", greek: "ἀσφαλέστερον ἔσται τὸν πόλεμον ἦρος ποιεῖσθαι." },
{ id: 1094, english: "Those who fight are nobler than those who are enslaved.", greek: "οἱ μαχόμενοι εὐγενέστεροί εἰσι τῶν δουλουμένων." },
{ id: 1095, english: "Those who honor the gods are the noblest of all.", greek: "οἱ τοὺς θεοὺς τιμῶντες πάντων εὐγενέστατοί εἰσιν." },
{ id: 1096, english: "Oh that Greece may not be enslaved by the king!", greek: "εἴθε ἡ Ἑλλὰς ὑπὸ τοῦ βασιλέως μὴ δουλωθείη." },
{ id: 1097, english: "Do not enslave the brave leader of the calvary.", greek: "μὴ δουλώσῃς τὸν τῶν ἱππέων ἀνδρείον ἡγεμόνα." },
{ id: 1098, english: "Much wisdom will be shown by the judge.", greek: "πολλὴ ἀρετὴ δηλωθήσεται ὑπὸ τοῦ κριτοῦ." },
{ id: 1099, english: "The whole city was enslaved by the great king.", greek: "πᾶσα ἡ πόλις ἐδουλώθη ὑπὸ τοῦ μεγάλου βασιλέως." },
{ id: 1100, english: "Those who fight before the walls will be safest.", greek: "οἱ πρὸ τῶν τειχῶν μαχόμενοι ἀσφαλέστατοι ἔσονται." },
{ id: 1101, english: "The men in the ships were safer than those fighting in the city.", greek: "οἱ ἐν ταῖς ναυσὶν (ἄνδρες) ἀσφαλέστεροι ἦσαν τῶν ἐν τῇ πόλει μαχομένων." },
{ id: 1102, english: "Much courage was shown by all the women.", greek: "πολλὴ ἀρετὴ ὑπὸ πασῶν τῶν γυναικῶν ἐδηλώθη." },
{ id: 1103, english: "In spring and summer the island will be beautiful with trees.", greek: "ἦρος καὶ θέρους ἡ νῆσος καλὴ ἔσται δένδρεσιν." },
{ id: 1104, english: "In three months we will carry on the war with much courage.", greek: "τριῶν μηνῶν τὸν πόλεμον πολλῇ ἀρετῇ ποιησόμεθα." },
{ id: 1105, english: "Oh that the many may not be enslaved by the nobles!", greek: "εἴθε οἱ πολλοὶ ὑπὸ τῶν εὐγενῶν μὴ δουλωθεῖεν." },
{ id: 1106, english: "The sons of free men are wiser than slaves.", greek: "οἱ τῶν ἐλευθέρων παῖδες τῶν δούλων σοφώτεροί εἰσιν." },
{ id: 1107, english: "The richest citizens do not always benefit their city.", greek: "οἱ πλουσιώτατοι πολῖται οὐκ ἀεὶ εὖ ποιοῦσι τὴν πόλιν." },
{ id: 1108, english: "Wisdom is very useful in war.", greek: "ἡ σοφία ἐν πολέμῳ χρησιμωτάτη ἐστιν." },
{ id: 1109, english: "Show courage in the battle, O bravest of all men.", greek: "τὴν ἀρετὴν ἐν μάχῃ δηλοῦτε, ὦ πάντων ἀνδρειότατοι." },
{ id: 1110, english: "It will be most difficult to carry on the war in the spring.", greek: "χαλεπώτατον ἔσται τὸν πόλεμον ἦρος ποιεῖθαι." },
{ id: 1111, english: "The work was easily accomplished in five days.", greek: "τὸ ἔργον ῥᾳδίως ἐπράχθη πέντε ἡμερῶν." },
{ id: 1112, english: "All those who were defeated fled to the camp.", greek: "πάντες οἱ νικηθέντες ἔφυγον πρὸς τὸ στρατόπεδον." },
{ id: 1113, english: "The most temperate men have sacrificed to the gods.", greek: "οἱ σωφρονέστατοι τεθύκασι τοῖς θεοῖς." },
{ id: 1114, english: "The Greeks will not flee out of the country.", greek: "οἱ Ἕλληνες οὐ φεύξονται ἐκ τῆς χώρας." },
{ id: 1115, english: "Those who harm their country will not flee from the gods.", greek: "τὸ χαλεπὸν ἔργον ὑπὸ τῶν ναυτῶν πέπρακται." },
{ id: 1116, english: "Those who were enslaved by the king have fled in the night.", greek: "οἱ ὑπὸ βασιλέως δουλωθέντες νυκτὸς πεφεύγασιν." },
{ id: 1117, english: "The walls were guarded by the bravest citizens.", greek: "οὐκ ἐφύγετε πρὸς τὰ τείχη, ὦ στρατιῶται." },
{ id: 1118, english: "It will be safer for the women to fly out of the city.", greek: "οἱ ἱερῆς τεθύκασι τοῖς τῆς Ἑλλάδος θεοῖς." },
{ id: 1119, english: "The task has been accomplished by the leader of the cavalry.", greek: "μὴ φύγῃς τὸ τῶν Περσῶν στράτευμα." },
{ id: 1120, english: "The conquerors were more temperate than the conquered.", greek: "οὐ τιμήσομεν τοὺς ἐκ τῆς πόλεως φυγόντας." },
{ id: 1121, english: "He has sought his benefactor in every city.", greek: "τὸν εὖ πεποιηκότα ἐν πάσῃ πόλει ἐζήτηκεν." },
{ id: 1122, english: "The soldiers have guarded the walls of the city well.", greek: "οἱ στρατιῶται εὖ πεφυλάχασι τὰ τῆς πόλεως τείχη." },
{ id: 1123, english: "Everything was accomplished in six months by the priest.", greek: "πάντα ἓξ μηνῶν ὑπὸ τοῦ ἱερέως ἐπράχθη." },
{ id: 1124, english: "We shall flee into the country of the Persians by night.", greek: "νυκτὸς φευξόμεθα εἰς τὴν τῶν Περσῶν χώραν." },
{ id: 1125, english: "On the third day the words of the king were more kindly.", greek: "τρίτῃ ἡμέρᾳ οἱ τοῦ βασιλέως λόγοι εὐφρονέστεροι ἦσαν." },
{ id: 1126, english: "The more temperate men had sacrificed to the gods.", greek: "οἱ σωφρονέστεροι ἐτεθύκεσαν τοῖς θεοῖς." },
{ id: 1127, english: "Having been defeated, we fled to the camp.", greek: "νικηθέντες εἰς τὸ στρατόπεδον ἐφύγομεν." },
{ id: 1128, english: "You will not flee from the gods, young man.", greek: "οὐ τοὺς θεοὺς φεύξει, ὦ νεανία." },
{ id: 1129, english: "Socrates was the most temperate of all the Greeks.", greek: "ὁ Σωκράτης πάντων τῶν Ἑλλήνων σωφρονέστατος ἦν." },
{ id: 1130, english: "The city was guarded by sailors and soldiers.", greek: "ἡ πόλις ὑπὸ ναυτῶν καὶ στρατιωτῶν ἐφυλάχθη." },
{ id: 1131, english: "Those who avoided Socrates did not love virtue.", greek: "οἱ τὸν Σωκράτη φυγόντες οὐκ ἐφίλουν τὴν ἀρετήν." },
{ id: 1132, english: "We seek the most temperate men in the city.", greek: "τοὺς ἐν τῇ πόλει σωφρονεστάτους ζητοῦμεν." },
{ id: 1133, english: "Let us flee from those who are guarding the city.", greek: "φύγωμεν τοὺς τὴν πόλιν φυλάττοντας." },
{ id: 1134, english: "Those who sacrificed to the gods have prospered in the battle.", greek: "οἱ τοῖς θεοῖς θύσαντες εὖ πεπράχασιν ἐν τῇ μάχῃ." },
{ id: 1135, english: "The difficult task has been accomplished by the sailors.", greek: "οἱ τὴν πατρίδα βλάπτοντες οὐ τοὺς θεοὺς φεύξονται." },
{ id: 1136, english: "Having been honoured with gifts they trusted the words of the herald.", greek: "δώροις τιμηθέντες ἐπίστευσαν τοῖς τοῦ κήρυκος λόγοις." },
{ id: 1137, english: "You did not flee to the walls, soldiers.", greek: "τὰ τείχη ἐφυλάχθη ὑπὸ τῶν ἀνδρειοτάτων πολιτῶν." },
{ id: 1138, english: "The priests have sacrificed to the gods of Greece.", greek: "ἀσφαλέστερον ἔσται ταῖς γυναιξὶν ἐκ τῆς πόλεως φυγεῖν." },
{ id: 1139, english: "Do not flee from the army of the Persians.", greek: "τὸ ἔργον πέπρακται ὑπὸ τοῦ τῶν ἱππέων ἡγεμόνος." },
{ id: 1140, english: "We shall not honour those who fled out of the city.", greek: "οἱ νενικηκότες σωφρονέστεροι ἦσαν τῶν νενικημένων." },
{ id: 1141, english: "The Greeks were not deceived by the pleasant words of the king.", greek: "οἱ Ἕλληνες οὐκ ἐψεύσθησαν τοῖς τοῦ βασιλέως ἡδέσι λόγοις." },
{ id: 1142, english: "The greatest cities were enslaved by the conquerors.", greek: "αἱ μέγισται πόλεις ὑπὸ τῶν νενικηκότων ἐδουλώθησαν." },
{ id: 1143, english: "Those who tell lies do not honour the gods.", greek: "οἱ ψευδόμενοι οὐ τιμῶσι τοὺς θεούς." },
{ id: 1144, english: "We were willing to honour the greatest poet.", greek: "ἠθέλομεν τιμᾶν τὸν μέγιστον ποιητήν." },
{ id: 1145, english: "The Greeks were not willing to fight in winter.", greek: "ἡ Ἑλλὰς ἐσώθη τῇ τῶν πόλεμον ποιουμένων ἀρετῇ." },
{ id: 1146, english: "Those who do everything for their country are loved by all.", greek: "οἱ ὑπὸ τοῦ ῥήτορος παιδευθέντες οὐκ ἤθελον φυλάττειν τὴν πόλιν." },
{ id: 1147, english: "They have been deceived by the pleasant words of the herald.", greek: "ἠποροῦμεν πρὸς τοὺς ἱππέας μαχόμενοι" },
{ id: 1148, english: "The bravest men will be drawn up in front of the gates.", greek: "ὑπὸ τῆς χαριέσσης γυναικὸς πεπεισμένοι εἰσίν." },
{ id: 1149, english: "Being perplexed we would not trust the leader.", greek: "τὸν γέροντα ἡδέσι λόγοις ἐψεύσαμεν." },
{ id: 1150, english: "The women were saved by the brave slaves.", greek: "οἱ μείζονες ποιηταὶ οὐκ ἤθελον τιμᾶν τὸν βασιλέα." },
{ id: 1151, english: "Let us not be deceived by the herald of the Persians.", greek: "μὴ ψευσθῶμεν ὑπὸ τοῦ τῶν Περσῶν κήρυκος." },
{ id: 1152, english: "All the ships fled into the harbours of Greece.", greek: "πᾶσαι αἱ νῆες ἔφυγον εἰς τοὺς τῆς Ἑλλάδος λιμένας." },
{ id: 1153, english: "Being perplexed, he told lies and would not obey.", greek: "ἀπορῶν ἐψεύσατο καὶ οὐκ ἤθελε πείθεσθαι." },
{ id: 1154, english: "The greatest ships are not always the safest.", greek: "αἱ μέγισται νῆες οὐκ ἀεὶ ἀσφαλέσταταί εἰσιν." },
{ id: 1155, english: "The most temperate men would not honour the king.", greek: "οἱ σωφρονέστατοι οὐκ ἤθελον τιμᾶν τὸν βασιλέα." },
{ id: 1156, english: "The cavalry were drawn up in front of the walls.", greek: "οἱ ἱππῆς ἐτάχθησαν πρὸ τῶν τειχῶν." },
{ id: 1157, english: "The richest men sent the greatest gifts.", greek: "οἱ πλουσιώτατοι ἔπεμψαν τὰ μέγιστα δῶρα." },
{ id: 1158, english: "Demosthenes, the greatest orator, was often perplexed.", greek: "Δημοσθένης, ὁ μέγιστος ῥήτωρ, πολλάκις ἠπόρει." },
{ id: 1159, english: "The power of the Greeks was then greater.", greek: "ἡ τῶν Ἑλλήνων δύναμις τότε μείζων ἦν." },
{ id: 1160, english: "The women will not be deceived by the words of the orator.", greek: "αἱ γυναῖκες οὐ ψευσθήσονται τοῖς τοῦ ῥήτορος λόγοις." },
{ id: 1161, english: "Oh that the Greeks may not be persuaded to harm Socrates!", greek: "εἴθε οἱ Ἕλληνες μὴ πεισθεῖεν βλάπτειν τὸν Σωκράτη." },
{ id: 1162, english: "It will be disgraceful to carry on the war on behalf of the king.", greek: "αἰσχρὸν ἔσται ὑπὲρ τοῦ βασιλέως τὸν πόλεμον ποιεῖσθαι." },
{ id: 1163, english: "The general of the Greeks was perplexed.", greek: "ὁ τῶν Ἑλλήνων στρατηγὸς ἠπόρει." },
{ id: 1164, english: "Let us not be persuaded to enslave free citizens.", greek: "μὴ πεισθῶμεν ἐλευθέρους πολίτας δουλῶσαι." },
{ id: 1165, english: "Greece was saved by the courage of those who carried on the war.", greek: "οἱ Ἕλληνες οὐκ ἤθελον χειμῶνος μάχεσθαι." },
{ id: 1166, english: "Those who were trained by the orator were not willing to guard the city.", greek: "οἱ πάντα ὑπὲρ τῆς πατρίδος πράττοντες ὑπὸ πάντων φιλοῦνται." },
{ id: 1167, english: "We were perplexed when fighting against the cavalry.", greek: "τοῖς τοῦ κήρυκος ἡδέσι λόγοις ἐψευσμένοι εἰσίν." },
{ id: 1168, english: "They have been persuaded by the graceful woman.", greek: "οἱ ἀνδρειότατοι πρὸ τῶν πυλῶν ταχθήσονται." },
{ id: 1169, english: "We deceived the old man by pleasant words.", greek: "ἀποροῦντες οὐκ ἠθέλομεν πιστεύειν τῷ ἡγεμόνι." },
{ id: 1170, english: "The greater poets were not willing to honour the king.", greek: "αἱ γυναῖκες ἐσώθησαν ὑπὸ τῶν ἀνδρείων δούλων." },
{ id: 1171, english: "The poets asked for very many gifts.", greek: "οἱ ποιηταὶ πλεῖστα δῶρα ᾔτησαν." },
{ id: 1172, english: "Gifts were sent to the boy by his mother.", greek: "δῶρα ἐπέμφθη πρὸς τὸν παῖδα ὑπὸ τῆς μητρός." },
{ id: 1173, english: "The soldiers, having left their ranks, asked for arms.", greek: "οἱ στρατιῶται, τὰς τάξεις λιπόντες, ὅπλα ᾔτησαν." },
{ id: 1174, english: "Do not leave the old man in the city.", greek: "μὴ λίπῃς τὸν γέροντα ἐν τῇ πόλει." },
{ id: 1175, english: "Those who were left in the land asked for many things.", greek: "οἱ ἐν τῇ λειφθέντες πόλλ’ ᾔτησαν." },
{ id: 1176, english: "They left very many ships in the harbour.", greek: "πλείστας ναῦς ἐν τῷ λιμένι ἔλιπον." },
{ id: 1177, english: "Most gifts were sent by those who had prospered in the war.", greek: "πλεῖστα δῶρα ἐπέμφθη ὑπὸ τῶν ἐν τῷ πολέμῳ εὖ πραξάντων." },
{ id: 1178, english: "The Persians have conquered and the gods have forsaken the city.", greek: "οἱ Πέρσαι νενικήκασι καὶ οἱ θεοὶ λελοίπασι τὴν πόλιν." },
{ id: 1179, english: "Being perplexed, we left all the women in the ships.", greek: "ἀποροῦντες πάσας τὰς γυναῖκας ἐν ταῖς ναυσὶν ἐλίπομεν." },
{ id: 1180, english: "May you not be sent out of the city to the king!", greek: "μὴ ἐκ τῆς πόλεως πρὸς τὸν βασιλέα πεμφθείης." },
{ id: 1181, english: "Those who were sent did not ask for arms.", greek: "οἱ πεμφθέντες οὐκ ᾔτησαν ὅπλα." },
{ id: 1182, english: "We deceived those who were left in the city with pleasant words.", greek: "ἡδέσι λόγοις ἐψεύσαμεν τοὺς ἐν τῇ πόλει λειφθέντας." },
{ id: 1183, english: "Very many cities were carrying on the war with much courage.", greek: "πλεῖσται πόλεις πολλῇ ἀρετῇ τὸν πόλεμον ἐποιοῦντο." },
{ id: 1184, english: "It will be safest to leave all the women in the city.", greek: "ἀσφαλέστατον ἔσται πάσας τὰς γυναῖκας ἐν τῇ πόλει λιπεῖν." },
{ id: 1185, english: "The soldier, having been saved by his general, fled to the harbour.", greek: "ὁ στρατιώτης, ὑπὸ τοῦ στρατηγοῦ σωθείς, ἔφυγε πρὸς τὸν λιμένα." },
{ id: 1186, english: "Oh that the soldiers may not leave their ranks!", greek: "εἴθε οἱ στρατιῶται μὴ λίποιεν τὰς τάξεις." },
{ id: 1187, english: "The cavalry were sent to the camp by their leader.", greek: "οἱ ἱππῆς πρὸς τὸ στρατόπεδον ἐπέμφθησαν ὑπὸ τοῦ ἡγεμόνος." },
{ id: 1188, english: "Let us not ask for many gifts.", greek: "μὴ πολλὰ δῶρα αἰτῶμεν." },
{ id: 1189, english: "It will be safer to leave the children in the house.", greek: "ἀσφαλέστερον ἔσται ἐν τῇ οἰκίᾳ λιπεῖν τοὺς παῖδας." },
{ id: 1190, english: "Being perplexed they fled to Demosthenes.", greek: "ἀποροῦντες ἔφυγον πρὸς τὸν Δημοσθένη." },
{ id: 1191, english: "Most true were the words of those who were sent by the king.", greek: "ἀληθέστατοι ἦσαν οἱ τῶν ὑπὸ τοῦ βασιλέως πεμφθέντων λόγοι." },
{ id: 1192, english: "There are very many kinds of fishes in the river.", greek: "ἰχθύων πολλὰ γένη ἐν τῷ ποταμῷ ἐστίν." },
{ id: 1193, english: "The task was easily accomplished by those left in the city.", greek: "τὸ ἔργον ῥᾳδίως ἐπράχθη ὑπὸ τῶν ἐν τῇ πόλει λειφθέντων." },
{ id: 1194, english: "Those who ask for everything are not loved by most people.", greek: "οἱ πάντα αἰτοῦντες ὑπὸ πλείστων οὐ φιλοῦνται." },
{ id: 1195, english: "Very many gifts were sent to the prosperous.", greek: "πλεῖστα δῶρα πρὸς τοὺς εὖ πράττοντας ἐπέμφθη." },
{ id: 1196, english: "Persuaded by Demosthenes, the citizens will carry on the war with great courage.", greek: "ὑπὸ τοῦ Δημοσθένους πεισθέντες οἱ πολῖται πολλῇ ἀρετῇ τὸν πόλεμον ποιήσονται." },
{ id: 1197, english: "Those who were saved were perplexed, and asked for arms.", greek: "ὁ σωθέντες ἠπόρουν καὶ ὅπλα ᾔτησαν." },
{ id: 1198, english: "The greatest poets are not always honoured by their fellow-citizens.", greek: "ὁ μέγιστοι ποιηταὶ οὐκ ἀεὶ τιμῶνται ὑπὸ τῶν πολιτῶν." },
{ id: 1199, english: "We fled by night out of the harbour into the town.", greek: "νυκτὸς ἐφύγομεν ἐκ τοῦ λιμένος εἰς τὴν πόλιν." },
{ id: 1200, english: "Everything will be accomplished in three days by those left in the city.", greek: "πάντα τριῶν ἡμερῶν πραχθήσεται ὑπὸ τῶν ἐν τῇ πόλει λειφθέντων." },
{ id: 1201, english: "The Athenians fitted out ten ships.", greek: "οἱ Ἀθηναῖοι δέκα ναῦς ἔστειλαν." },
{ id: 1202, english: "The ships were equipped in twelve days.", greek: "αἱ νῆες δώδεκα ἡμερῶν ἐστάλησαν." },
{ id: 1203, english: "The soldiers will fly to the mountains.", greek: "οἱ στρατιῶται πρὸς τὰ ὄρη φεύξονται." },
{ id: 1204, english: "The most temperate men did not advise the Athenians to fit out ships.", greek: "οἱ σωφρονέστατοι οὐκ ἔπειθον τοὺς Ἀθηναίους ναῦς στέλλειν." },
{ id: 1205, english: "The richest men had many houses.", greek: "οἱ πλουσιώτατοι πολλὰς οἰκίας εἶχον." },
{ id: 1206, english: "They announced everything to the king of the Persians.", greek: "πάντα ἤγγειλαν τῷ τῶν Περσῶν βασίλει." },
{ id: 1207, english: "We had most beautiful horses and very many houses.", greek: "καλλίστους ἵππους καὶ πλείστας οἰκίας εἴχομεν." },
{ id: 1208, english: "They equipped very many ships when fighting against the Persians.", greek: "πρὸς τοὺς Πέρσας μαχόμενοι πλείστας ναῦς ἔστειλαν." },
{ id: 1209, english: "We had not a leader, and all the soldiers were perplexed.", greek: "πλείστας ναῦς καὶ ἀνδρειοτάτους στρατιώτας ἕξομεν." },
{ id: 1210, english: "The citizens, being perplexed, would not guard the walls.", greek: "τὰ τῆς Ἑλλάδος ὄρη μέγιστα καὶ κάλλιστα ἦν." },
{ id: 1211, english: "Everything was announced by those who fled to the camp.", greek: "πάντα ἠγγέλθη ὑπὸ τῶν πρὸς τὸ στρατόπεδον φυγόντων." },
{ id: 1212, english: "In the spring they will flee to the mountains of Greece.", greek: "ἦρος φεύξονται πρὸς τὰ τῆς Ἑλλάδος ὄρη." },
{ id: 1213, english: "We announced everything to the leaders of the cavalry.", greek: "πάντα ἠγγείλαμεν τοῖς τῶν ἱππέων ἡγεμόσιν." },
{ id: 1214, english: "Those who advise the Athenians to harm Socrates are not good citizens.", greek: "οἱ τοὺς Ἀθηναίους πείθοντες τὸν Σωκράτη βλάπτειν οὐκ ἀγαθοὶ πολῖταί εἰσιν." },
{ id: 1215, english: "The slaves reported everything to the king.", greek: "οἱ δοῦλοι πάντα ἤγγειλαν τῷ βασιλεῖ." },
{ id: 1216, english: "Those who tell lies do not often deceive the king.", greek: "οἱ ψευδόμενοι οὐ πολλάκις ψεύδουσι τὸν βασιλέα." },
{ id: 1217, english: "The wisest men advised the Athenians to leave their city and flee to their ships.", greek: "οἱ σοφώτατοι ἔπειθον τοὺς Ἀθηναίους τὴν πόλιν λιπεῖν καὶ πρὸς τὰς ναῦς φυγεῖν." },
{ id: 1218, english: "We shall equip ten ships in the spring.", greek: "δέκα ναῦς ἦρος στελοῦμεν." },
{ id: 1219, english: "The Athenians were the most temperate of all the Greeks.", greek: "οἱ Ἀθηναῖοι πάντων τῶν Ἑλλήνων σωφρονέστατοι ἦσαν." },
{ id: 1220, english: "The many honour those who possess most things.", greek: "οἱ πολλοὶ τιμῶσι τοὺς πλεῖστα ἔχοντας." },
{ id: 1221, english: "Athenians, do not be conquered by those who fled from your fathers.", greek: "μὴ νικᾶσθε, ὦ Ἀθηναῖοι, ὑπὸ τῶν τοὺς πατέρας φυγόντων." },
{ id: 1222, english: "Deceived by the herald's words, we fitted out ships.", greek: "ταῖς τοῦ κήρυκος λόγοις ψευσθέντες ναῦς ἐστείλαμεν." },
{ id: 1223, english: "Defeated by the cavalry, we fled to the mountains.", greek: "ὑπὸ τῶν ἱππέων νικηθέντες πρὸς τὰ ὄρη ἐφύγομεν." },
{ id: 1224, english: "The Greeks had not horses in the battle.", greek: "οἱ Ἕλληνες ἵππους ἐν τῇ μάχῃ οὐκ εἶχον." },
{ id: 1225, english: "The citizens have fled and the gods have forsaken the city.", greek: "οἱ πολῖται πεφεύγασι καὶ οἱ θεοὶ τὴν πόλιν λελοίπασιν." },
{ id: 1226, english: "She was more beautiful than the wife of Socrates.", greek: "καλλίων ἦν τῆς τοῦ Σωκράτους γυναικός." },
{ id: 1227, english: "Those who possess most things are not always the most temperate.", greek: "οἱ πλεῖστα ἔχοντες οὐκ ἀεὶ σωφρονέστατοί εἰσιν." },
{ id: 1228, english: "Those who had sacrificed to the gods reported many things to the general.", greek: "οἱ τοῖς θεοῖς θύσαντες πολλὰ ἤγγειλαν τῷ στρατηγῷ." },
{ id: 1229, english: "We shall have very many ships and very brave soldiers.", greek: "ἡγεμόνα οὐκ καὶ πάντες οἱ στρατιῶται ἠπόρουν." },
{ id: 1230, english: "The mountains of Greece were very large and very beautiful.", greek: "οἱ πολῖται ἀποροῦντες οὐκ ἤθελον φυλάττειν τὰ τείχη." },
{ id: 1231, english: "We threw many darts into the ranks of the enemy.", greek: "πολλὰ βέλη ἐβάλομεν εἰς τὰς τῶν πολεμίων τάξεις." },
{ id: 1232, english: "The Greeks attacked the cavalry of the king.", greek: "οἱ Ἕλληνες προσέβαλον τοῖς τοῦ βασιλέως ἱππεῦσιν." },
{ id: 1233, english: "Those who had been conquered escaped out of the city by night.", greek: "οἱ νικηθέντες νυκτὸς ἐξέφυγον ἐκ τῆς πόλεως." },
{ id: 1234, english: "Having defeated the Persians, he wrote a history of the war.", greek: "τοὺς Πέρσας νικήσας τὰ τοῦ πολέμου συνέγραψεν." },
{ id: 1235, english: "We shall not attack the camp of the Persians.", greek: "τῷ τῶν Περσῶν στρατοπέδῳ οὐ προσβαλοῦμεν." },
{ id: 1236, english: "The victory of the brave sailors was announced to the enemy.", greek: "οἱ ἐκ τῆς πόλεως φυγόντες ἔψευσαν τοὺς φύλακας." },
{ id: 1237, english: "Oh that those who are attacking the city may be defeated!", greek: "ὁ σοφὸς ἱερεὺς συνέγραψε τὰ τῶν Ἀθηναίων." },
{ id: 1238, english: "Persuade the leader to attack the camp of the enemy.", greek: "μὴ προσβάλωμεν τοῖς τὴν πατρίδα σώσασιν." },
{ id: 1239, english: "You fled out of the house to the harbour.", greek: "μὴ λίπητε τὰς τάξεις, ὦ στρατιῶται." },
{ id: 1240, english: "They wrote a history of the great war.", greek: "ναῦς στείλωμεν καὶ τοῖς πολεμίοις προσβάλωμεν." },
{ id: 1241, english: "They persuaded the king to escape out of the city.", greek: "τὸν βασιλέα ἔπεισαν ἐκ τῆς πόλεως ἐκφυγεῖν." },
{ id: 1242, english: "Having been defeated by the Persians, you wrote a history of the war.", greek: "ὑπὸ τῶν Περσῶν νικηθεὶς τὰ τοῦ πολέμου συνέγραψας." },
{ id: 1243, english: "All those who had sacrificed were willing to attack the enemy.", greek: "πάντες οἱ θύσαντες ἤθελον προσβάλλειν τοῖς πολεμίοις." },
{ id: 1244, english: "We do not love those who attack our walls.", greek: "οὐ φιλοῦμεν τοὺς τοῖς τείχεσι προσβάλλοντας." },
{ id: 1245, english: "We shall throw darts into the ranks of the Persians.", greek: "βέλη βαλοῦμεν εἰς τὰς τῶν Περσῶν τάξεις." },
{ id: 1246, english: "They will escape out of the house in three days.", greek: "τριῶν ἡμερῶν ἐκ τῆς οἰκίας ἐκφεύξονται." },
{ id: 1247, english: "Let us write a history of our country.", greek: "τὰ τῆς πατρίδος συγγράφωμεν." },
{ id: 1248, english: "Those who attacked the city were defeated.", greek: "οἱ τῇ πόλει προσβαλόντες ἐνικήθησαν." },
{ id: 1249, english: "Do not persuade the guards to deceive their leader.", greek: "μὴ πείσῃς τοὺς φύλακας ψεύδειν τὸν ἡγεμόνα." },
{ id: 1250, english: "The ships were fitted out in the third year.", greek: "αἱ νῆες ἐστάλησαν τρίτου ἔτους." },
{ id: 1251, english: "The Athenians attacked the army of the Persians.", greek: "οἱ Ἀθηναῖοι προσέβαλον τῇ τῶν Περσῶν στρατιᾷ." },
{ id: 1252, english: "We attacked those who had fled out of the ships.", greek: "ἐπεθέμεθα τοῖς ἐκ νεῶν φυγοῦσιν." },
{ id: 1253, english: "Do not announce to the king the victory of the Athenians.", greek: "μὴ τῷ βασιλεῖ ἀγγείλῃς τὴν τῶν Ἀθηναίων νίκην." },
{ id: 1254, english: "Those who had fled into the camp had not darts.", greek: "οἱ εἰς τὸ στρατόπεδον φυγόντες βέλη οὐκ εἶχον." },
{ id: 1255, english: "The city will be enslaved by those who are now attacking the walls.", greek: "ἡ πόλις δουλωθήσεται ὑπὸ τῶν τοῖς τείχεσι νῦν προσβαλλόντων." },
{ id: 1256, english: "Those who escaped out of the city deceived the guards.", greek: "ἡ τῶν ἀνδρείων ναυτῶν νίκη ἠγγέλθη τοῖς πολεμίοις." },
{ id: 1257, english: "The wise priest wrote a history of the Athenians.", greek: "εἴθε οἱ τῇ πόλει προσβάλλοντες νικηθεῖεν." },
{ id: 1258, english: "Let us not attack those who saved their country.", greek: "πεῖσον τὸν ἡγεμόνα προσβάλλειν τῷ τῶν πολεμίων στρατοπέδῳ." },
{ id: 1259, english: "Do not leave your ranks, soldiers.", greek: "ἐκ τῆς οἰκίας ἔφυγες πρὸς τὸν λιμένα." },
{ id: 1260, english: "Let us fit out ships and attack the enemy.", greek: "τὰ τοῦ μεγάλου πολέμου συνέγραψαν." },
{ id: 1261, english: "Let us quickly send away those who deceived the old man.", greek: "ταχέως ἀποπέμπωμεν τοὺς τὸν γέροντα ψεύσαντας." },
{ id: 1262, english: "The mountains were not far distant from the river.", greek: "τὰ ὄρη οὐ πολὺ ἀπεῖχεν ἀπὸ τοῦ ποταμοῦ." },
{ id: 1263, english: "They left behind the most honourable and most temperate.", greek: "κατέλιπον τοὺς καλλίστους καὶ σωφρονεστάτους." },
{ id: 1264, english: "Many of the noblest men were sent away by the king.", greek: "πολλοὶ τῶν εὐγενεστάτων ὑπὸ τοῦ βασιλέως ἀπεπέμφθησαν." },
{ id: 1265, english: "Those who were left behind attacked the enemy bravely.", greek: "οἱ καταλειφθέντες ἀνδρείως προσέβαλον τοῖς πολεμίοις." },
{ id: 1266, english: "The cavalry fought more bravely than those drawn up before the walls.", greek: "οἱ ἱππῆς ἀνδρειότερον ἐμάχοντο τῶν πρὸ τῶν τειχῶν ταχθέντων." },
{ id: 1267, english: "Oh that the poet may act more temperately.", greek: "εἴθε ὁ ποιητὴς σωφρονέστερον πράττοι." },
{ id: 1268, english: "The river was not far from the enemy's camp.", greek: "ὁ ποταμὸς οὐ πολὺ ἀπεῖχεν ἀπὸ τοῦ τῶν πολεμίων στρατοπέδου." },
{ id: 1269, english: "I sent away all those who had fled to the city.", greek: "ἀπέπεμψα πάντας τοὺς πρὸς τὴν πόλιν φυγόντας." },
{ id: 1270, english: "Those who had been trained by the rhetorician acted more wisely.", greek: "οἱ ὑπὸ τοῦ ῥήτορος παιδευθέντες σοφώτερον ἔπραξαν." },
{ id: 1271, english: "The bravest men do not always act most wisely.", greek: "οἱ ἀνδρειότατοι οὐκ ἀεὶ σοφώτατα πράττουσιν." },
{ id: 1272, english: "The Athenians always honoured those who showed most courage.", greek: "οἱ Ἀθηναῖοι ἀεὶ ἐτίμων τοὺς πλείστην ἀρετὴν δηλώσαντας." },
{ id: 1273, english: "We had very brave soldiers and very many darts.", greek: "ἀνδρειοτάτους στρατιώτας καὶ πλεῖστα βέλη εἴχομεν." },
{ id: 1274, english: "The victory of the Athenians was quickly announced to the king.", greek: "ἡ τῶν Ἀθηναίων νίκη ταχέως ἠγγέλθη τῷ βασιλεῖ." },
{ id: 1275, english: "All those who threw darts harmed the enemy.", greek: "πάντες οἱ βέλη βαλόντες ἔβλαψαν τοὺς πολεμίους." },
{ id: 1276, english: "Those who write the history of their country are honoured by all.", greek: "οἱ τὰ τῆς πατρίδος συγγράφοντες ὑπὸ πάντων τιμῶνται." },
{ id: 1277, english: "Those who had announced the victory were well treated by the citizens.", greek: "οἱ τὴν νίκην ἀγγείλαντες εὖ ἐποιήθησαν ὑπὸ τῶν πολιτῶν." },
{ id: 1278, english: "We shall attack the walls of the city in the winter.", greek: "χειμῶνος προσβαλοῦμεν τοῖς τῆς πόλεως τείχεσιν." },
{ id: 1279, english: "The herald of the king has acted very wisely.", greek: "ὁ τοῦ βασιλέως κῆρυξ σοφώτατα πέπραχεν." },
{ id: 1280, english: "Let us fight very bravely and defeat the enemy.", greek: "ἀνδρειότατα μαχώμεθα καὶ νικῶμεν τοὺς πολεμίους." },
{ id: 1281, english: "The general's camp was not far distant from the city.", greek: "τὸ τοῦ στρατηγοῦ στρατόπεδον οὐ πολὺ ἀπεῖχεν ἀπὸ τῆς πόλεως." },
{ id: 1282, english: "Do not send the young man away, O king!", greek: "μὴ ἀποπέμψῃς τὸν νεανίαν, ὦ βασιλεῦ." },
{ id: 1283, english: "Let us not leave behind in the city the women and the children.", greek: "μὴ ἐν τῇ πόλει καταλείπωμεν τὰς γυναῖκας καὶ τοὺς παῖδας." },
{ id: 1284, english: "The cavalry were not far distant from the enemy.", greek: "οἱ ἱππῆς οὐ πολὺ ἀπεῖχον ἀπὸ τῶν πολεμίων." },
{ id: 1285, english: "Do not leave your wife behind in the house.", greek: "μὴ ἐν τῇ οἰκίᾳ καταλίπῃς τὴν γυναῖκα." },
{ id: 1286, english: "The soldiers, having left their arms behind, fled quickly to the camp.", greek: "οἱ στρατιῶται, τὰ ὅπλα καταλιπόντες, ταχέως ἔφυγον πρὸς τὸ στρατόπεδον." },
{ id: 1287, english: "They left their wives and children behind in the mountains.", greek: "τὰς γυναῖκας καὶ τοὺς παῖδας ἐν τοῖς ὄρεσι κατέλιπον." },
{ id: 1288, english: "Those who had persuaded the king to attack the city fled by night.", greek: "οἱ τὸν βασιλέα πείσαντες προσβαλεῖν τῇ πόλει νυκτὸς ἔφυγον." },
{ id: 1289, english: "The mountains of Greece were not far distant from the sea.", greek: "τὰ τῆς Ἑλλάδος ὄρη οὐ πολὺ ἀπεῖχεν ἀπὸ τῆς θαλάττης." },
{ id: 1290, english: "He quickly despatched a herald to the leader of the enemy.", greek: "κήρυκα ταχέως ἀπέπεμψε πρὸς τὸν τῶν πολεμίων ἡγεμόνα." },
{ id: 1291, english: "Great were the hopes of the Athenians.", greek: "μεγάλαι ἦσαν αἱ τῶν Ἀθηναίων ἐλπίδες." },
{ id: 1292, english: "The herald was with me in the house.", greek: "ὁ κῆρυξ ἦν μετ’ ἐμοῦ ἐν τῇ οἰκίᾳ." },
{ id: 1293, english: "Those who show most courage will conquer in the battle.", greek: "οἱ πλείστην ἀρετὴν δηλοῦντες νικήσουσιν ἐν τῇ μάχῃ." },
{ id: 1294, english: "Those who had been set free placed their fetters in the house.", greek: "οἱ λυθέντες τὰς πέδας ἔθηκαν ἐν τῇ οἰκίᾳ." },
{ id: 1295, english: "The general sent many gifts to me.", greek: "ὁ στρατηγὸς πολλὰ δῶρα πρὸς ἐμὲ ἔπεμψεν." },
{ id: 1296, english: "The king of the Persians enacted many laws.", greek: "ὁ τῶν Περσῶν βασιλεὺς ἔθηκε πολλοὺς νόμους." },
{ id: 1297, english: "We place the gifts in the temples.", greek: "τὰ δῶρα ἐν τοῖς νεῲς τίθεμεν." },
{ id: 1298, english: "They were placing the arms in the house of the general.", greek: "τὰ ὅπλα ἐν τῇ τοῦ στρατηγοῦ οἰκίᾳ ἐτίθεσαν." },
{ id: 1299, english: "They despatched us to the camp of the Persians.", greek: "ἀπέπεμψαν ἡμᾶς πρὸς τὸ τῶν Περσῶν στρατόπεδον." },
{ id: 1300, english: "You were placing arms in the temple of the goddess.", greek: "ὅπλα ἐν τῷ τῆς θεᾶς νεῲ ἐτίθεις." },
{ id: 1301, english: "They placed the gifts of the citizens in the temple.", greek: "τὰ τῶν πολιτῶν δῶρα ἐν τῷ νεῲ ἔθηκαν." },
{ id: 1302, english: "He was placing the arms of the general in the house of the citizen.", greek: "τὰ τοῦ στρατηγοῦ ὅπλα ἐτίθει ἐν τῇ τοῦ πολίτου οἰκίᾳ." },
{ id: 1303, english: "The poet will place the gift of the king in the temple.", greek: "ὁ ποιητὴς ἐν τῷ νεῲ θήσει τὸ τοῦ βασιλέως δῶρον." },
{ id: 1304, english: "He transacted the affair for me.", greek: "τὸ πρᾶγμ’ ἐμοὶ ἔπραξεν." },
{ id: 1305, english: "They were with me in the temple.", greek: "ἦσαν μετ’ ἐμοῦ ἐν τῷ νεῴ." },
{ id: 1306, english: "The king has enacted many laws.", greek: "ὁ βασιλεὺς πολλοὺς νόμους τέθηκεν." },
{ id: 1307, english: "Let us place our arms in the temple of the goddess.", greek: "τιθῶμεν τὰ ὅπλα ἐν τῷ τῆς θεᾶς νεῴ." },
{ id: 1308, english: "He transacted the affairs of Greece with the wisest citizens.", greek: "τὰ τῆς Ἑλλάδος μετὰ τῶν σοφωτάτων ἔπραξεν." },
{ id: 1309, english: "He persuaded us to attack the walls.", greek: "ἔπεισεν ἡμᾶς προσβαλεῖν τοῖς τείχεσιν." },
{ id: 1310, english: "In ten days they will announce to us the victory.", greek: "δέκα ἡμερῶν ἀγγελοῦσιν ἡμῖν τὴν νίκην." },
{ id: 1311, english: "The conquerors despatched a herald to us on the third day.", greek: "οἱ νενικηκότες τρίτῃ ἡμέρᾳ κήρυκα πρὸς ἡμᾶς ἀπέπεμψαν." },
{ id: 1312, english: "The city trusted us in the terrible war.", greek: "ἡ πόλις ἐπίστευσεν ἡμῖν έν τῷ δεινῷ πολέμῳ." },
{ id: 1313, english: "Those who had been defeated fled to us by night.", greek: "οἱ νικηθέντες πρὸς ἡμᾶς νυκτὸς ἔφυγον." },
{ id: 1314, english: "Those who had been honoured by me would not trust the king.", greek: "οἱ ὑπ’ ἐμοῦ τιμηθέντες οὐκ ἤθελον πιστεύειν τῷ βασιλεῖ." },
{ id: 1315, english: "Being perplexed, they fled out of the city to us.", greek: "ἀποροῦντες ἐκ τῆς πόλεως ἔφυγον πρὸς ἡμᾶς." },
{ id: 1316, english: "Having left their ranks, they have fled to the Athenians.", greek: "τὰς τάξεις λιπόντες πεφεύγασι πρὸς τοὺς Ἀθηναίους." },
{ id: 1317, english: "The king will enact laws for the conquered.", greek: "ὁ βασιλεὺς νόμους θήσει τοῖς νενικημένοις." },
{ id: 1318, english: "We placed the arms of the general in the temple.", greek: "ἔθεμεν τὰ τοὺ στρατηγοῦ ὅπλα ἐν τῷ νεῴ." },
{ id: 1319, english: "The herald was seeking us in the city.", greek: "ὁ κῆρυξ ἐζήτει ἡμᾶς ἐν τῇ πόλει." },
{ id: 1320, english: "Oh that the king may not enact laws for the Greeks!", greek: "εἴθε ὁ βασιλεὺς μὴ νόμους θείη τοῖς Ἕλλησιν." },
{ id: 1321, english: "The enemy attacked us on the fifth day.", greek: "οἱ πολέμιοι προσέβαλον ἡμῖν πέμπτῃ ἡμέρᾳ." },
{ id: 1322, english: "The Persians will not attack you, citizens.", greek: "οἱ Πέρσαι οὐ προσβαλοῦσιν ὑμῖν, ὦ πολῖται." },
{ id: 1323, english: "Laws are enacted by those who administer the affairs of the city.", greek: "οἱ νόμοι τίθενται ὑπὸ τῶν τὰ τῆς πόλεως πραττόντων." },
{ id: 1324, english: "Those who were defeated will not trust you, general.", greek: "οἱ νικηθέντες οὐ πιστεύσουσί σοι, ὦ στρατηγέ." },
{ id: 1325, english: "They transacted the affair for you.", greek: "ἔπραξάν σοι τὸ πρᾶγμα." },
{ id: 1326, english: "We all love those who trust us.", greek: "πάντες φιλοῦμεν τοὺς ἡμῖν πιστεύοντας." },
{ id: 1327, english: "Those who escaped out of the city are now with us.", greek: "οἱ ἐκ τῆς πόλεως φυγόντες νῦν μεθ’ ἡμῶν εἰσίν." },
{ id: 1328, english: "May they not attack those who have benefited us!", greek: "μὴ ἐπιθεῖντο τοῖς ἡμᾶς εὖ πεποιήκασιν." },
{ id: 1329, english: "Let us not attack those who have been left behind in the camp.", greek: "μὴ ἐπιθώμεθα τοῖς ἐν τῷ στρατοπέδῳ καταλελειμμένοις." },
{ id: 1330, english: "Those who enslave us, citizens, will enslave you.", greek: "οἱ ἡμᾶς δουλοῦντες ὑμᾶς δουλώσουσιν, ὦ πολῖται." },
{ id: 1331, english: "They will announce to you the victory of the sailors.", greek: "ἀγγελοῦσί σοι τὴν τῶν ναυτῶν νίκην." },
{ id: 1332, english: "We were with you in the mountains of Greece.", greek: "ἦμεν μετὰ σοῦ ἐν τοῖς τῆς Ἑλλάδος ὄρεσιν." },
{ id: 1333, english: "The general will administer the affairs most wisely with you.", greek: "ὁ στρατηγὸς μετὰ σοῦ σοφώτατα πράξει τὰ πράγματα." },
{ id: 1334, english: "They will attack us in the summer with the king.", greek: "θέρους μετὰ τοῦ βασιλέως ἡμῖν ἐπιθήσονται." },
{ id: 1335, english: "He will be with you in Greece in the spring.", greek: "ἦρος ἔσται μετὰ σοῦ ἐν τῇ Ἑλλάδι." },
{ id: 1336, english: "Those who trusted you were deceived, Demosthenes.", greek: "οἱ πιστεύσαντές σοι ἐψεύσθησαν, ὦ Δημόσθενες." },
{ id: 1337, english: "Those who threw the darts fled out of the city.", greek: "οἱ τὰ βέλη βαλόντες ἔφυγον ἐκ τῆς πόλεως." },
{ id: 1338, english: "We despatched a herald to you, O king, on the third day.", greek: "τρίτῃ ἡμέρᾳ ἄγγελον πρὸς σὲ ἀπεπέμψαμεν, ὦ βασιλεῦ." },
{ id: 1339, english: "Many laws were enacted by us on behalf of the city.", greek: "πολλοὶ νόμοι ὑφ’ ἡμῶν ἐτέθησαν ὑπὲρ τῆς πόλεως." },
{ id: 1340, english: "He persuaded us to attack the walls by night.", greek: "ἔπεισεν ἡμᾶς νυκτὸς τοῖς τείχεσι προσβαλεῖν." },
{ id: 1341, english: "Those who love their country will not trust you.", greek: "οἱ τὴν πατρίδα φιλοῦντες οὐ σοὶ πιστεύσουσιν." },
{ id: 1342, english: "The cavalry of the enemy will not attack us.", greek: "οἱ τῶν πολεμίων ἱππῆς οὐ προσβαλοῦσιν ἡμῖν." },
{ id: 1343, english: "Those who enslave us will enslave Greece.", greek: "οἱ ἡμᾶς δουλοῦντες τὴν Ἑλλάδα δουλώσουσιν." },
{ id: 1344, english: "The younger men believed you, Socrates.", greek: "οἱ νεώτεροι ἐπίστευσάν σοι, ὦ Σώκρατες." },
{ id: 1345, english: "Those who honour the gods obey those who enact laws.", greek: "οἱ τοὺς θεοὺς τιμῶντες πείθονται τοῖς νόμους τιθεῖσιν." },
{ id: 1346, english: "The slaves fled to us by night.", greek: "οἱ δοῦλοι νυκτὸς ἔφυγον πρὸς ἡμᾶς." },
{ id: 1347, english: "Oh that you may not defeat us in the battle!", greek: "εἴθε μὴ νικῴης ἡμᾶς ἐν τῇ μάχῃ." },
{ id: 1348, english: "Those who were left in the camp were braver than the generals.", greek: "οἱ ἐν τῷ στρατοπέδῳ λειφθέντες ἀνδρειότεροι ἦσαν τῶν στρατηγῶν." },
{ id: 1349, english: "A large army was sent by us into Greece.", greek: "μεγάλη στρατιὰ ὑφ’ ἡμῶν ἐπέμφθη εἰς τὴν Ἑλλάδα." },
{ id: 1350, english: "Those who harmed us have not benefited their country.", greek: "οἱ ἡμᾶς βλάψαντες οὐκ ὠφελήκασι τὴν πατρίδα." },
{ id: 1351, english: "Having defeated the Persians, the Athenians set up a trophy.", greek: "τοὺς Πέρσας νικήσαντες οἱ Ἀθηναῖοι τροπαῖον ἔστησαν." },
{ id: 1352, english: "The boy is standing in the broad road.", greek: "ὁ παῖς ἔστηκεν ἐν τῇ εὐρείᾳ ὁδῷ." },
{ id: 1353, english: "We wrote many letters to him in the summer.", greek: "θέρους πολλὰς ἐπιστολὰς πρὸς αὐτὸν ἐπέμψαμεν." },
{ id: 1354, english: "The conquered will not set up a trophy.", greek: "οἱ νενικημένοι οὐ στήσουσι τροπαῖον." },
{ id: 1355, english: "The king despatched him to the leader of the Greeks.", greek: "ὁ βασιλεὺς ἀπέπεμψεν αὐτὸν πρὸς τὸν τῶν Ἑλλήνων ἡγεμόνα." },
{ id: 1356, english: "The guards stood in front of the gates of the city.", greek: "οἱ φύλακες ἔστησαν πρὸ τῶν τῆς πόλεως πυλῶν." },
{ id: 1357, english: "The general is setting up a trophy in the island.", greek: "ὁ στρατηγὸς τροπαῖον ἵστησιν ἐν τῷ νεῴ." },
{ id: 1358, english: "All the Athenians honoured and loved him.", greek: "πάντες οἱ Ἀθηναῖοι ἐτίμων καὶ ἐφίλουν αὐτόν." },
{ id: 1359, english: "We ordered him to place his arms in the temple.", greek: "ἐκελεύσαμεν αὐτὸν ἐν τῷ νεῲ τιθέναι τὰ ὅπλα." },
{ id: 1360, english: "Having prospered in the war, we set up a trophy.", greek: "ἐν τῷ πολέμῳ εὖ πράξαντες τροπαῖον ἐστήσαμεν" },
{ id: 1361, english: "We announced to him the victory of the general.", greek: "ἠγγείλαμεν αὐτῷ τὴν τοῦ στρατηγοῦ νίκην." },
{ id: 1362, english: "Those standing in the road were not far distant from the camp.", greek: "οἱ ἐν τῇ ὁδῷ ἑστηκότες οὐ πολὺ ἀπεῖχον ἀπὸ τοῦ στρατοπέδου." },
{ id: 1363, english: "The general set up a trophy in the temple of the goddess.", greek: "ὁ στρατηγὸς τροπαῖον ἔστησεν ἐν τῷ τῆς θεᾶς νεῴ." },
{ id: 1364, english: "The laws of the city are not enacted by him.", greek: "οἱ τῆς πόλεως νόμοι οὐκ ὑπ’ αὐτοῦ τίθενται." },
{ id: 1365, english: "We stood with him in front of the walls.", greek: "ἔστημεν μετ’ αὐτοῦ πρὸ τῶν τειχῶν." },
{ id: 1366, english: "Those who conquer the enemy often set up trophies.", greek: "οἱ τοὺς πολεμίους νικῶντες πολλάκις τροπαῖα ἱστᾶσιν." },
{ id: 1367, english: "We trusted both you and him in the war.", greek: "καὶ σοὶ καὶ αὐτῷ ἐπιστεύομεν ἐν τῷ πολέμῳ." },
{ id: 1368, english: "The Athenians will be willing to despatch you to the king.", greek: "οἱ Ἀθηναῖοι ἐθελήσουσιν ἀποπέμπειν σε πρὸς τὸν βασιλέα." },
{ id: 1369, english: "You stood with me in the road.", greek: "ἔστης μετ’ ἐμοῦ ἐν τῇ ὁδῷ." },
{ id: 1370, english: "We sought him in the mountains of Greece.", greek: "ἐζητήσαμεν αὐτὸν ἐν τοῖς τῆς Ἑλλάδος ὄρεσιν." },
{ id: 1371, english: "Let us set up a trophy in the island, Demosthenes.", greek: "τροπαῖον ἱστῶμεν ἐν τῇ νήσῳ, ὦ Δημόσθενες." },
{ id: 1372, english: "Persuaded by Socrates, we trained him in wisdom.", greek: "ὑπὸ τοῦ Σωκράτους πεισθέντες ἐπαιδεύσαμεν αὐτὸν ἐν τῇ σοφίᾳ." },
{ id: 1373, english: "The king was with him in the camp.", greek: "ὁ βασιλεὺς ἦν μετ’ αὐτοῦ ἐν τῷ στρατοπέδῳ." },
{ id: 1374, english: "We stood with you in the road.", greek: "ἔστημεν μετὰ σοῦ ἐν τῇ ὁδῶ." },
{ id: 1375, english: "The task will be very difficult for you, citizens.", greek: "τὸ ἔργον χαλεπώτατον ἔσται ὑμῖν, ὦ πολῖται." },
{ id: 1376, english: "Oh that the Persians may not set up a trophy in the island!", greek: "εἴθε οἱ Πέρσαι μὴ τροπαῖον ἐν τῇ νήσῳ στήσειαν." },
{ id: 1377, english: "Do not persuade him to fly out of the city.", greek: "μὴ πείσῃς αὐτὸν ἐκ τῆς πόλεως φεύγειν." },
{ id: 1378, english: "The sharp teeth of the lion will not harm him.", greek: "οἱ τοῦ λέοντος ὀξεῖς ὀδόντες οὐ βλάψουσιν αὐτόν." },
{ id: 1379, english: "Every city despatched heralds to the king.", greek: "πᾶσα πόλις κήρυκας ἀπέπεμψε πρὸς τὸν βασιλέα." },
{ id: 1380, english: "Those who had left their ranks had not horses.", greek: "οἱ τὰς τάξεις λιπόντες ἵππους οὐκ εἶχον." },
{ id: 1381, english: "They revolted from the Athenians in the summer.", greek: "τοῦ θέρους ἀπέστησαν ἀπὸ τῶν Ἀθηναίων." },
{ id: 1382, english: "Trophies are not set up by the conquered.", greek: "τροπαῖα ὑπὸ τῶν νενικημένων οὐχ ἵσταται." },
{ id: 1383, english: "My father ordered him to cease from the task.", greek: "ὁ ἐμὸς πατὴρ ἐκέλευσεν αὐτὸν παύεσθαι τοῦ ἔργου." },
{ id: 1384, english: "We shall not revolt from you, Athenians.", greek: "οὐκ ἀποστησόμεθα ἀφ’ ὑμῶν, ὦ Ἀθηναῖοι." },
{ id: 1385, english: "My arms were in the camp.", greek: "τὰ ἐμὰ ὅπλα ἐν τῷ στρατοπέδῳ ἦν." },
{ id: 1386, english: "The island has revolted from the Athenians.", greek: "ἡ νῆσος ἀφέστηκεν ἀπὸ τῶν Ἀθηναίων." },
{ id: 1387, english: "You revolted from the king of the Persians.", greek: "ἀπέστης τοῦ τῶν Περσῶν βασιλέως." },
{ id: 1388, english: "My house was not far distant from the sea.", greek: "ἡ ἐμὴ οἰκία οὐ πολὺ ἀπεῖχε τῆς θαλάττης." },
{ id: 1389, english: "Having revolted from the Athenians, they were perplexed.", greek: "τῶν Ἀθηναίων ἀποστάντες ἠπόρουν." },
{ id: 1390, english: "My father placed the arms in the temple.", greek: "ὁ ἐμὸς πατὴρ ἐν τῷ νεῲ ἔθηκε τὰ ὅπλα." },
{ id: 1391, english: "The boy was trained in wisdom by my mother.", greek: "ὁ παῖς ἐπαιδεύθη ἐν τῇ σοφίᾳ ὑπὸ τῆς ἐμῆς μητρος." },
{ id: 1392, english: "The old men persuaded us to revolt.", greek: "οἱ γέροντες ἔπεισαν ἡμᾶς ἀποστῆναι." },
{ id: 1393, english: "Those who revolted were drawn up in the road.", greek: "οἱ ἀποστάντες ἐν τῇ ὁδῷ ἐτάχθησαν." },
{ id: 1394, english: "My brother wrote a history of the great war.", greek: "ὁ ἐμὸς ἀδελφὸς συνέγραψε τὰ μεγάλου πολέμου." },
{ id: 1395, english: "My wife wrote a letter to her mother.", greek: "ἡ ἐμὴ γυνὴ ἐπιστολὴν ἔγραψε τῇ μητρί." },
{ id: 1396, english: "My son was persuaded by the pleasant words of the orator.", greek: "ὁ ἐμὸς παῖς ἐπείσθη τοῖς τοῦ ῥήτορος ἡδέσι λόγοις." },
{ id: 1397, english: "The bravest soldiers revolted from the king.", greek: "οἱ ἀνδρειότατοι στρατιῶται ἀπέστησαν τοῦ βασιλέως." },
{ id: 1398, english: "My father was the most temperate of all the Greeks.", greek: "ὁ ἐμὸς πατὴρ πάντων τῶν Ἑλλήνων σωφρονέστατος ἦν." },
{ id: 1399, english: "They will write a letter to you, father.", greek: "ἐπιστολὴν πρὸς σὲ γράψουσιν, ὦ πάτερ." },
{ id: 1400, english: "He is standing with my son in front of the house.", greek: "μετὰ τοῦ παιδὸς πρὸ τῆς οἰκίας ἔστηκεν." },
{ id: 1401, english: "The most temperate men will not revolt from the king.", greek: "οἱ σωφρονέστατοι οὐκ ἀποστήσονται ἀπὸ τοῦ βασιλέως." },
{ id: 1402, english: "The general ordered me to stand in front of the walls.", greek: "ὁ στρατηγὸς ἐκέλευσέ με πρὸ τῶν τειχῶν στῆναι." },
{ id: 1403, english: "Those who ask for arms will not flee from the enemy.", greek: "οἱ ὅπλα αἰτοῦντες οὐ φεύξονται τοὺς πολεμίους." },
{ id: 1404, english: "My father announced the victory of the Athenians.", greek: "ὁ ἐμὸς πατὴρ ἤγγειλε τὴν τῶν Ἀθηναίων νίκην." },
{ id: 1405, english: "My mother was very rich and had many houses.", greek: "ἡ ἐμὴ μήτηρ πλουσιωτάτη ἦν καὶ πολλὰς οἰκίας εἶχεν." },
{ id: 1406, english: "The mountains of my country were beautiful with trees.", greek: "τὰ τῆς ἐμῆς πατρίδος ὄρη καλὰ δένδρεσιν ἦν." },
{ id: 1407, english: "Those who stood with me in the road were fighting very bravely.", greek: "οἱ μετ’ ἐμοῦ ἐν τῇ ὁδῷ ἑστηκότες ἀνδρειότατα ἐμάχοντο." },
{ id: 1408, english: "Having defeated the Persians, he is setting up a trophy.", greek: "τοὺς Πέρσας νικήσας τροπαῖον ἵστησιν." },
{ id: 1409, english: "He who trusts kings is often deceived.", greek: "ὁ τοῖς βασιλεῦσι πιστεύων πολλάκις ψεύδεται." },
{ id: 1410, english: "My father will be with you in three days.", greek: "ὁ ἐμὸς πρατὴρ τριῶν ἡμερῶν μετὰ σοῦ ἔσται." },
{ id: 1411, english: "They gave us many horses and large houses.", greek: "ἔδοσαν ἡμῖν πολλοῦς ἵππους καὶ μεγάλας οἰκίας." },
{ id: 1412, english: "They used to give many presents to the soldiers.", greek: "πολλὰ δῶρα ἐδίδοσαν τοῖς στρατιώταις." },
{ id: 1413, english: "He gave me the lion's body.", greek: "ἔδωκέ μοι τὸ τοῦ λέοντος σῶμα." },
{ id: 1414, english: "We shall give everything to those who save the city.", greek: "πάντα δώσομεν τοῖς τὴν πόλιν σῴζουσιν." },
{ id: 1415, english: "The gods gave the victory to us.", greek: "οἱ θεοὶ ἔδωκαν ἡμῖν τὴν νίκην." },
{ id: 1416, english: "Always give to those who ask.", greek: "ἀεὶ δίδου τοῖς αἰτοῦσιν." },
{ id: 1417, english: "Your father ordered me to obey the laws.", greek: "ὁ σὸς πατὴρ ἐκέλευσέ με τοῖς νόμοις πείθεσθαι." },
{ id: 1418, english: "Socrates, persuade your son to honour his mother.", greek: "ὦ Σώκρατε, πεῖθε τὸν παῖδα τιμᾶν τὴν μητέρα." },
{ id: 1419, english: "We all trusted your father in the battle.", greek: "πάντες τῷ σῷ πατρὶ ἐπιστεύομεν ἐν τῇ μάχῃ." },
{ id: 1420, english: "The judge was persuaded by gifts to set your brother free.", greek: "ὁ κριτὴς δώροις ἐπείσθη λύειν τὸν σὸν ἀδελφόν." },
{ id: 1421, english: "We placed all our arms in the house.", greek: "ἐν τῇ οἰκίᾳ ἔθεμεν πάντα τὰ ὅπλα." },
{ id: 1422, english: "Your father set up a trophy in the island.", greek: "ὁ σὸς πατὴρ τροπαῖον ἔθηκεν ἐν τῇ νήσῳ." },
{ id: 1423, english: "They had the courage of their father.", greek: "τὴν τοῦ πατρὸς ἀρετὴν εἶχον." },
{ id: 1424, english: "May the citizens give you many gifts!", greek: "εἴθε οἱ πολῖται πολλά σοι δῶρα δοῖεν." },
{ id: 1425, english: "The Athenians did not then honour kings.", greek: "οἱ Ἀθηναῖοι οὐ τότε ἐτίμων τοὺς βασιλέας." },
{ id: 1426, english: "Your house was far distant from the river.", greek: "ἡ σὴ οἰκία πολὺ ἀπεῖχεν ἀπὸ τοῦ ποταμοῦ." },
{ id: 1427, english: "Let us give arms to those left behind in the camp.", greek: "ὅπλα δῶμεν τοῖς ἐν τῷ στρατοπέδῳ καταλελειμμένοις." },
{ id: 1428, english: "I gave all the arms to the slaves.", greek: "πάντα τὰ ὅπλα τοῖς δούλοις ἔδωκα." },
{ id: 1429, english: "Your mother, being perplexed, despatched me to the king.", greek: "ἡ σὴ μήτηρ ἀποροῦσα ἀπέπεμψέ με πρὸς τὸν βασιλέα." },
{ id: 1430, english: "Do not ask for many things: give everything.", greek: "μὴ πολλὰ αἴτει· δίδου πάντα." },
{ id: 1431, english: "All the cities revolted from the king.", greek: "πᾶσαι αἱ πόλεις ἀπέστησαν τοῦ βασιλέως." },
{ id: 1432, english: "We gave many beautiful presents to the judge.", greek: "πολλὰ καὶ καλὰ δῶρα ἐδώκαμεν τῷ κριτῇ." },
{ id: 1433, english: "The horses were more useful to us than the slaves.", greek: "οἱ ἵπποι χρησιμώτεροι ἡμῖν ἦσαν ἤ τοῖς δούλοις." },
{ id: 1434, english: "It will not be very honourable to give everything to the enemy.", greek: "οὐ κάλλιστον ἔσται πάντα δοῦναι τοῖς πολεμίοις." },
{ id: 1435, english: "The judge was more temperate than the poet.", greek: "ὁ κριτὴς σωφρονέστερος ἦν τοῦ ποιητοῦ." },
{ id: 1436, english: "They are giving everything to their brothers.", greek: "πάντα τοῖς ἀδελφοῖς διδόασιν." },
{ id: 1437, english: "I was with him in Greece for many months.", greek: "πολλοὺς μῆνας ἦν μετ’ αὐτοῦ ἐν τῇ Ἑλλάδι." },
{ id: 1438, english: "There were many sailors with us in the harbour.", greek: "ἦσαν μεθ’ ἡμῶν πολλοὶ ναῦται ἐν τῷ λιμένι." },
{ id: 1439, english: "Do not give gifts to free citizens.", greek: "μὴ δῶρα δίδου τοῖς ἐλευθέροις πολίταις." },
{ id: 1440, english: "Most true were the words of my mother.", greek: "ἀληθέστατοι ἦσαν οἱ τῆς ἐμῆς μητρὸς λόγοι." },
{ id: 1441, english: "Many gifts were given to us by our fathers.", greek: "πολλὰ δῶρα ἐδόθη ἡμῖν ὑπὸ τῶν πατέρων." },
{ id: 1442, english: "The general betrayed the city to the enemy.", greek: "ὁ στρατηγὸς προὔδωκε τὴν πόλιν τοῖς πολεμίοις." },
{ id: 1443, english: "Your brother will not betray his country.", greek: "ὁ σὸς ἀδελφὸς οὐ προδώσει τὴν πατρίδα." },
{ id: 1444, english: "You were saved by the valour of our fathers.", greek: "τῇ τῶν ἡμετέρων πατέρων ἀρετῇ ἐσώθητε." },
{ id: 1445, english: "Those who were perplexed always fled to our city.", greek: "οἱ ἀποροῦντες ἀεὶ πρὸς τὴν ἡμετέραν πόλιν ἔφευγον." },
{ id: 1446, english: "The city was betrayed by the guards.", greek: "ἡ πόλις προὐδόθη ὑπὸ τῶν φυλάκων." },
{ id: 1447, english: "We do not give everything to those who ask.", greek: "οὐ πάντα δίδομεν τοῖς αἰτοῦσιν." },
{ id: 1448, english: "The houses were given to me by my brother.", greek: "αἱ οἰκίαι ἐδόθησάν μοι ὑπὸ τοῦ ἀδελφοῦ." },
{ id: 1449, english: "Our city will be betrayed by the guards.", greek: "ἡ ἡμετέρα πόλις ὑπὸ τῶν φυλάκων προδοθήσεται." },
{ id: 1450, english: "All those who honour the gods love our temples.", greek: "πάντες οἱ τοὺς θεοὺς τιμῶντες φιλοῦσι τοὺς ἡμετέρους νεώς." },
{ id: 1451, english: "Give arms to the slaves and guard the house.", greek: "δὸς ὅπλα τοῖς δούλοις καὶ φύλαττε τὴν οἰκίαν." },
{ id: 1452, english: "The king was saved together with those who had fled.", greek: "ὁ βασιλεὺς ἐσώθη μετὰ φυγόντων." },
{ id: 1453, english: "Let us not betray those who have fled to us.", greek: "μὴ προδῶμεν τοὺς πρὸς ἡμᾶς πεφευγότας." },
{ id: 1454, english: "Many gifts are given to those who conquer in the contest.", greek: "πολλὰ δῶρα δίδοται τοῖς ἐν τῷ ἀγῶνι νικῶσιν." },
{ id: 1455, english: "Arms were given to those who had fled out of the city.", greek: "ὅπλα ἐδόθη τοῖς ἐκ τῆς πόλεως φυγοῦσιν." },
{ id: 1456, english: "Oh that the city may not be betrayed!", greek: "μὴ προδοθείη ἡ πόλις." },
{ id: 1457, english: "Do not give the horse to your brother.", greek: "μὴ δῷς τὸν ἵππον τῷ σῷ ἀδελφῷ." },
{ id: 1458, english: "Our fathers revolted from the Persians.", greek: "οἱ ἡμέτεροι πατέρες ἀπέστησαν τῶν Περσῶν." },
{ id: 1459, english: "He wrote a history of our country.", greek: "τὰ τῆς ἡμετέρας πατρίδος συνέγραψεν." },
{ id: 1460, english: "They despatched a herald to our king.", greek: "κήρυκα ἀπέπεμψαν πρὸς τὸν ἡμέτερον βασιλέα." },
{ id: 1461, english: "Do not attack our city, O king!", greek: "μὴ προσβάλῃς τῇ ἡμετέρᾳ πόλει, ὦ βασιλεῦ." },
{ id: 1462, english: "Those who harm our country are not loved by the gods.", greek: "οἱ τὴν ἡμετέραν πατρίδα βλάπτοντες οὐ φιλοῦνται ὑπὸ τῶν θεῶν." },
{ id: 1463, english: "The city will place all its hope in our courage.", greek: "ἡ πόλις πᾶσαν τὴν ἐλπίδα θήσει ἐν τῇ ἡμετέρᾳ ἀρετῇ." },
{ id: 1464, english: "In the spring our island is beautiful with trees.", greek: "τοῦ ἦρος ἡ ἡμετέρα νῆσος καλή ἐστι δένδρεσιν." },
{ id: 1465, english: "Do not betray those who trusted you, O king!", greek: "μὴ προδῷς τοὺς πιστεύσαντάς σοι, ὦ βασιλεῦ." },
{ id: 1466, english: "Let us not betray our city to the nobles.", greek: "μὴ τοῖς εὐγενέσι προδῶμεν τὴν ἡμετέραν πόλιν." },
{ id: 1467, english: "The bravest soldiers were with us in the city.", greek: "οἱ ἀνδρειότατοι στρατιῶται μεθ’ ἡμῶν ἦσαν ἐν τῇ πόλει." },
{ id: 1468, english: "They despatched me with my brother to Greece.", greek: "ἀπέπεμψάν με μετὰ τοῦ ἀδελφοῦ πρὸς τὴν Ἑλλάδα." },
{ id: 1469, english: "Our soldiers ceased from the battle.", greek: "οἱ ἡμέτεροι στρατιῶται ἐπαύσαντο τῆς μάχης." },
{ id: 1470, english: "Those who betrayed the city are standing in the road.", greek: "οἱ τὴν πόλιν προδόντες ἐν τῇ ὁδῷ ἑστήκασιν." },
{ id: 1471, english: "The conquerors are coming to the city.", greek: "οἱ νενικηκότες ἔρχονται πρὸς τὴν πόλιν." },
{ id: 1472, english: "We went to the mountains of Greece.", greek: "πρὸς τὰ τῆς Ἑλλάδος ὄρη ἤλθομεν." },
{ id: 1473, english: "Those who are in the city will be defeated.", greek: "οἱ ἐν τῇ πόλει (ὄντες) νικηθήσονται." },
{ id: 1474, english: "Let us go to the camp of the Persians.", greek: "πρὸς τὸ τῶν Περσῶν στρατόπεδον ἴωμεν." },
{ id: 1475, english: "Oh that your city may always be free, Athenians!", greek: "ἀεὶ ἐλευθέρα εἴη ἡ ὑμετέρα πόλις, ὦ Ἀθηναῖοι." },
{ id: 1476, english: "He came with us to the king.", greek: "ἦλθε μεθ’ ἡμῶν πρὸς τὸν βασιλέα." },
{ id: 1477, english: "After the battle we shall go to the harbour.", greek: "μετὰ τὴν μάχην ἴμεν πρὸς τὸν λιμένα." },
{ id: 1478, english: "The soldier will go to our city.", greek: "ὁ στρατιῶτης πρὸς τὴν ἡμετέραν πόλιν εἶσιν." },
{ id: 1479, english: "Be brave in the battle, soldiers.", greek: "ἀνδρεῖοι ἔστε ἐν τῇ μάχῃ, ὦ στρατιῶται." },
{ id: 1480, english: "He was appointed general by the king.", greek: "στρατηγὸς ἀπεδείχθη ὑπὸ τοῦ βασιλέως." },
{ id: 1481, english: "After the victory the Athenians appointed Demosthenes general.", greek: "μετὰ τὴν νίκην οἱ Ἀθηναῖοι στρατηγὸν ἀπέδειξαν τὸν Δημοσθένη." },
{ id: 1482, english: "Having come into the house he gave me the arms.", greek: "εἰς τὴν οἰκίαν ἐλθὼν ἔδωκέ μοι τὰ ὅπλα." },
{ id: 1483, english: "We persuaded the king to go into Greece.", greek: "ἐπείσαμεν τὸν βασιλέα εἰς τὴν Ἑλλάδα ἐλθεῖν." },
{ id: 1484, english: "May you be more brave than your father!", greek: "ἀνδρειότερος εἴης τοῦ πατρός." },
{ id: 1485, english: "May you not go with the king to the island!", greek: "μὴ μετὰ τοῦ βασιλέως εἰς τὴν νῆσον ἔλθοις." },
{ id: 1486, english: "Those who fled out of the city will go to you.", greek: "οἱ ἐκ τῆς πόλεως φυγόντες πρὸς σὲ ἴασιν." },
{ id: 1487, english: "The law was enacted on behalf of those who come to our city.", greek: "ὁ νόμος ἐτέθη ὑπὲρ τῶν πρὸς τὴν ἡμετέραν πόλιν ἐλθόντων." },
{ id: 1488, english: "Let us go to the land and hunt lions.", greek: "πρὸς τὴν γῆν ἔλθωμεν καὶ λέοντας θηρεύσωμεν." },
{ id: 1489, english: "Oh that you may be wiser than the judge!", greek: "σοφώτερος εἴης τοῦ κριτοῦ." },
{ id: 1490, english: "Having come into the island they set up a trophy.", greek: "εἰς τὴν νῆσον ἐλθόντες τροπαῖον ἔστησαν." },
{ id: 1491, english: "Let us go to him on the third day.", greek: "τρίτῃ ἡμέρᾳ ἔλθωμεν πρὸς αὐτόν." },
{ id: 1492, english: "They will go to Greece with those who conquered in the battle.", greek: "εἰς τὴν Ἑλλάδα ἴασι μετά τῶν ἐν τῇ μάχῃ νικησάντων." },
{ id: 1493, english: "After the war they went to all the cities of Greece.", greek: "μετὰ τὸν πόλεμον πρὸς πάσας τὰς τῆς Ἑλλάδος πόλεις ἦλθον." },
{ id: 1494, english: "We came to the city on the tenth day.", greek: "δεκάτῃ ἡμέρᾳ πρὸς τὴν πόλιν ἤλθομεν." },
{ id: 1495, english: "He ordered the herald to go to the king.", greek: "ἐκέλευσε τὸν κήρυκα πρὸς τὸν βασιλέα ἰέναι." },
{ id: 1496, english: "The ships, having come into the harbour, were safe.", greek: "αἱ νῆες πρὸς τὸν λιμένα ἐλθοῦσαι ἀσφαλεῖς ἦσαν." },
{ id: 1497, english: "They came to Greece with those who revolted.", greek: "εἰς τὴν Ἑλλάδα ἦλθον μετὰ τῶν ἀποστάντων." },
{ id: 1498, english: "The king gave the city to the Athenians.", greek: "ὁ βασιλεὺς τὴν πόλιν ἔδωκε τοῖς Ἀθηναίοις." },
{ id: 1499, english: "Having enacted many laws he went out of the city.", greek: "πολλοὺς νόμους θεὶς ἐκ τῆς πόλεως ἦλθεν." },
{ id: 1500, english: "Not being very brave they do not honour courage.", greek: "ἀνδρειότατοι οὐκ ὄντες τὴν ἀρετὴν οὐ τιμῶσιν." },
{ id: 1501, english: "All men admired this city.", greek: "πάντες ἐθαύμαζον ταύτην τὴν πόλιν." },
{ id: 1502, english: "Those who honour virtue will admire Socrates.", greek: "οἱ τὴν ἀρετὴν τιμῶντες τὸν Σωκράτη θαυμάσονται." },
{ id: 1503, english: "The cavalry fought most bravely for Greece.", greek: "οἱ ἱππῆς ἀνδρειότατα ἐμάχοντο ὑπὲρ τῆς Ἑλλάδος." },
{ id: 1504, english: "The victory of Demosthenes increased the honour of the city.", greek: "ἡ τοῦ Δημοσθένους νίκη ηὔξησε τὴν τῆς πόλεως τιμήν." },
{ id: 1505, english: "These gifts were pleasing to the king.", greek: "ταῦτα τὰ δῶρα ἡδέα ἦν τῷ βασιλεῖ." },
{ id: 1506, english: "Your father always admired this city.", greek: "ὁ σὸς πατὴρ ἀεὶ ἐθαύμαζε ταύτην τὴν πόλιν." },
{ id: 1507, english: "It will be difficult for the cavalry to fight in these mountains.", greek: "χαλεπὸν ἔσται τοῖς ἱππεῦσιν ἐν τούτοις τοῖς ὄρεσι μάχεσθαι." },
{ id: 1508, english: "These poets were admired by all the citizens.", greek: "οὗτοι οἱ ποιηταὶ ὑπὸ πάντων τῶν πολιτῶν ἐθαυμάσθησαν." },
{ id: 1509, english: "The Greeks gave many beautiful gifts to this general.", greek: "οἱ Ἕλληνες πολλὰ καὶ καλὰ δῶρα ἔδωκαν τούτῳ τῷ στρατηγῷ." },
{ id: 1510, english: "These women will fight for their country.", greek: "αὗται αἱ γυναῖκες ὑπὲρ τῆς πατρίδος μαχοῦνται." },
{ id: 1511, english: "All men honoured the courage of this woman.", greek: "πάντες ἐτίμησαν τὴν ταύτης τῆς γυναικὸς ἀρετήν." },
{ id: 1512, english: "Those who admire the Greeks often go to Greece.", greek: "οἱ τοὺς Ἕλληνας θαυμάζοντες πολλάκις πρὸς τὴν Ἑλλάδα ἔρχονται." },
{ id: 1513, english: "Those who displayed courage increased the honour of their country.", greek: "οἱ τὴν ἀρετὴν δηλώσαντες τὴν τῆς πατρίδος τιμὴν ηὔξησαν." },
{ id: 1514, english: "This city admired poets and orators.", greek: "αὕτη ἡ πόλις τοὺς ποιητὰς καὶ ῥήτορας ἐθαύμαζεν." },
{ id: 1515, english: "These boys went to the mountains at night.", greek: "οὗτοι οἱ παῖδες νυκτὸς ἦλθον πρὸς τὰ ὄρη." },
{ id: 1516, english: "This horse was given to me by my brother.", greek: "οὗτος ὁ ἵππος ἐδόθη μοι ὑπὸ τοῦ ἀδελφοῦ." },
{ id: 1517, english: "After this battle many were enslaved by the king.", greek: "μετὰ ταύτην τὴν μάχην πολλοὶ ἐδουλώθησαν ὑπὸ τοῦ βασιλέως." },
{ id: 1518, english: "The citizens will admire those who fight well.", greek: "οἱ πολῖται θαυμάσονται τοὺς εὖ μαχομένους." },
{ id: 1519, english: "These sailors betrayed their city to the enemy.", greek: "οὗτοι οἱ ναῦται τὴν πόλιν προὔδωκαν τοῖς πολεμίοις." },
{ id: 1520, english: "In this island there are many beautiful trees.", greek: "ἐν ταύτῃ τῇ νήσῳ πολλὰ καἰ καλὰ δένδρα ἐστιν." },
{ id: 1521, english: "Let us not admire those who betrayed their country.", greek: "μὴ θαυμάζωμεν τοὺς τὴν πατρίδα προδόντας." },
{ id: 1522, english: "The sons of the king increased the honour of the city.", greek: "οἱ τοῦ βασιλέως παῖδες ηὔξησαν τὴν τῆς πόλεως τιμήν." },
{ id: 1523, english: "This woman had three brothers.", greek: "αὕτη ἡ γυνὴ τρεῖς ἀδελφοὺς εἶχεν." },
{ id: 1524, english: "Do not admire those who tell lies.", greek: "μὴ θαυμάζετε τοὺς ψευδομένους." },
{ id: 1525, english: "Do not set up a trophy in this island.", greek: "μὴ τροπαῖον στήσῃς ἐν ταύτῃ τῇ νήσῳ." },
{ id: 1526, english: "Every city will admire our courage.", greek: "πᾶσα πόλις τὴν ἡμετέραν ἀρετὴν θαυμάσεται." },
{ id: 1527, english: "These ships came into the harbour by night.", greek: "αὗται αἱ νῆες νυκτὸς ἦλθον εἰς τὸν λιμένα." },
{ id: 1528, english: "For four days these soldiers were in the camp.", greek: "τέτταρας ἡμέρας οὗτοι οἱ στρατιῶται ἐν τῷ στρατοπέδῳ ἦσαν." },
{ id: 1529, english: "These things will not be difficult for a clever boy.", greek: "ταῦτα χαλεπὰ οὐκ ἔσται σοφῷ παιδί." },
{ id: 1530, english: "This army was defeated by those who had revolted.", greek: "αὑτὴ ἡ στρατιὰ ἐνικήθη ὑπὸ τῶν ἀποστάντων." },
{ id: 1531, english: "The soldiers marched into that city on the third day.", greek: "οἱ στρατιῶται τρίτῃ ἡμέρᾳ εἰς ἐκείνην τὴν πόλιν ἐπορεύθησαν." },
{ id: 1532, english: "We shall remain in the camp with the general.", greek: "ἐν τῷ στρατοπέδῳ μενοῦμεν μετὰ τοῦ στρατηγοῦ." },
{ id: 1533, english: "After the battle the citizens gave gifts to the soldiers.", greek: "μετὰ τὴν μάχην οἱ πολῖται δῶρα ἔδοσαν τοῖς στρατιώταις." },
{ id: 1534, english: "All the ships remained in the harbour.", greek: "πᾶσαι αἱ νῆες ἐν τῷ λιμένι ἔμειναν." },
{ id: 1535, english: "Those who reported the victory said this.", greek: "οἱ τὴν νίκην ἀγγείλαντες εἶπον τοῦτο." },
{ id: 1536, english: "Let us not say this to those who betrayed the city.", greek: "μὴ τοῦτ’ εἴπωμεν τοῖς τὴν πόλιν προδοῦσιν." },
{ id: 1537, english: "We shall not say this to the boy's father.", greek: "οὐ τοῦτ’ ἐροῦμεν τῷ τοῦ παιδὸς πατρί." },
{ id: 1538, english: "Those who had come to the city told us this.", greek: "οἱ πρὸς τὴν πόλιν ἐλθόντες τοῦθ’ ἡμῖν εἶπον." },
{ id: 1539, english: "Having said this they went to the walls of the city.", greek: "τοῦτο εἰπόντες πρὸς τὰ τῆς πόλεως τείχη ἦλθον." },
{ id: 1540, english: "We marched with the king for ten days.", greek: "δέκα ἡμέρας μετὰ τοῦ βασιλέως ἐπορευόμεθα." },
{ id: 1541, english: "The cavalry were drawn up in that road.", greek: "οἱ ἱππῆς ἐν ἐκείνῃ τῇ ὁδᾷ ἐτάχθησαν." },
{ id: 1542, english: "The judge was persuaded to say that.", greek: "ὁ κριτὴς ἐπείσθη ἐκεῖνο λέγειν." },
{ id: 1543, english: "Do not say that to the citizens, Demosthenes.", greek: "μὴ τοῖς πολίταις εἴπῃς ἐκεῖνο, ὦ Δημόσθενες." },
{ id: 1544, english: "Having said that, he ceased from his speech.", greek: "ἐκεῖνο εἰπὼν ἐπαύσατο τοῦ λόγου." },
{ id: 1545, english: "The king told me this on the second day.", greek: "ὁ βασιλεὺς εἶπέ μοι τοῦτο τῇ δευτέρᾳ ἡμέρᾳ." },
{ id: 1546, english: "The boy did not tell his mother this.", greek: "ὁ παῖς τῇ μητρὶ τοῦτ’ οὐκ εἶπεν." },
{ id: 1547, english: "Having marched to the city, we shall announce this.", greek: "πρὸς τὴν πόλιν πορευθέντες τοῦτο ἀγγελοῦμεν." },
{ id: 1548, english: "In that island women received much honour.", greek: "ἐν ἐκείνῃ τῇ νήσῳ αἱ γυναῖκες πολλὴν τιμὴν ἐδέχοντο." },
{ id: 1549, english: "It will be easy to increase the honour of this city.", greek: "ῥᾴδιον ἔσται αὐξάνειν τὴν ταύτης τῆς πόλεως τιμήν." },
{ id: 1550, english: "Your words were very true and more temperate than mine.", greek: "οἱ σοὶ λόγοι ἀληθέστατοι καὶ σωφρονέστεροι ἦσαν τῶν ἐμῶν." },
{ id: 1551, english: "Let us not injure those who said this.", greek: "μὴ βλάψωμεν τοὺς τοῦτο εἰπόντας." },
{ id: 1552, english: "After this the richest men came to the king.", greek: "μετὰ τοῦθ’ οἱ πλουσιώτατοι πρὸς τὸν βασιλέα ἦλθον." },
{ id: 1553, english: "Those left in the city remained in their houses.", greek: "οἱ ἐν τῇ πόλει λειφθέντες ἐν ταῖς οἰκίαις ἔμειναν." },

    let currentUtterance = null;
    let playQueue = [];
    let currentQueueIndex = 0;
    let currentRepeatCount = 0; // Tracks the iterations of the current sentence
    let delayTimeout = null;

    // Translates the slider's 4 physical positions into your exact repetition multipliers
    function updateRepeatLabel() {
        const val = parseInt(document.getElementById('repeatSlider').value);
        const options =; // Index 1 is 1x, Index 4 is 5x.
        document.getElementById('repeatValue').innerText = options[val];
    }

    // --- THE SMARTER ACCENT SCRUBBER ---
    function cleanForTTS(text) {
        let cleaned = text.normalize("NFD")
            .replace(/[\u0300\u0342\u0303]/g, '\u0301') // grave/circumflex to acute
            .replace(/[\u0313\u0314\u0345]/g, '') // breathings, iota subscript
            .normalize("NFC")
            .replace(/(^|[\s,;:'"(\[·-])([άέήίόύώΆΈΉΊΌΎΏ])(?=[\s,;:.!?"'\)\]·-]|$)/g, (match, prefix, letter) => {
                return prefix + letter.normalize("NFD").replace(/\u0301/g, '').normalize("NFC");
            });
        
        // --- CUSTOM PHONETIC DICTIONARY ---
        // If the TTS butchers an ancient word, add a rule here to spell it phonetically.
        // It won't change the text on the screen, only what the robot reads.
        // cleaned = cleaned.replace(/anotherWord/g, 'phoneticSpelling');

        // 1. Fix the ὦ issue by swapping a standalone ω for an omicron (ο)
        cleaned = cleaned.replace(/(^|[\s,;:'"(\[·-])[ωώ](?=[\s,;:.!?"'\)\]·-]|$)/g, '$1ο');
        // 2. Fixes the stress on ἔπαυον
        cleaned = cleaned.replace(/έπαυον/g, 'έπαβον'); 

        return cleaned;
    }
    // -----------------------------------

  const rowsTarget = document.getElementById('rowsTarget');
    sentences.forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${item.id}`;
        
        row.innerHTML = `
            <div class="num-cell">${item.id}</div>
            <div class="text-stack">
                <div class="el-cell" onclick="playSingle('${item.greek}', ${item.id})">${item.greek}</div>
                <div class="en-cell">${item.english}</div>
            </div>
        `;
        
        row.addEventListener('click', (e) => {
            if (e.target.closest('.el-cell')) return; 
            row.classList.toggle('selected-row');
        });

        rowsTarget.appendChild(row);
    });

    const batchDropdown = document.getElementById('batchDropdown');
    const batchSize = 5;
    
    for (let i = 0; i < sentences.length; i += batchSize) {
        const start = i + 1;
        const end = Math.min(i + batchSize, sentences.length);
        const btn = document.createElement('button');
        btn.className = 'batch-item';
        
        const startPad = String(start).padStart(4, '0');
        const endPad = String(end).padStart(4, '0');
        
        btn.innerText = `${startPad} - ${endPad}`;
        btn.onclick = () => toggleBatch(start, end, btn);
        batchDropdown.appendChild(btn);
    }

    function toggleDropdown() {
        document.getElementById("batchDropdown").classList.toggle("show");
    }

   // Use the modern Event Listener to safely close the dropdown
    window.addEventListener('click', (event) => {
        if (!event.target.matches('.dropbtn') && !event.target.closest('.dropdown-content')) {
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    });
    
    function toggleBatch(start, end, btnElement) {
        let allSelected = true;
        for (let i = start; i <= end; i++) {
            const targetRow = document.getElementById(`row-${i}`);
            if (targetRow && !targetRow.classList.contains('selected-row')) {
                allSelected = false;
                break;
            }
        }

        for (let i = start; i <= end; i++) {
            const targetRow = document.getElementById(`row-${i}`);
            if (targetRow) {
                if (allSelected) {
                    targetRow.classList.remove('selected-row');
                } else {
                    targetRow.classList.add('selected-row');
                }
            }
        }

        if (allSelected) {
            btnElement.classList.remove('active-batch');
        } else {
            btnElement.classList.add('active-batch');
            const firstRow = document.getElementById(`row-${start}`);
            if (firstRow) {
                setTimeout(() => {
                    const y = firstRow.getBoundingClientRect().top + window.scrollY - 150;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }, 50);
            }
        }
    }

    function clearSelection() {
        document.querySelectorAll('.row').forEach(r => r.classList.remove('selected-row'));
        document.querySelectorAll('.batch-item').forEach(b => b.classList.remove('active-batch'));
    }

    function getPlaybackRate() {
        return parseFloat(document.getElementById('speedSlider').value);
    }

    function playSingle(text, id) {
        stopPlayback();
        clearPlayingHighlight();
        
        const row = document.getElementById(`row-${id}`);
        row.classList.add('active-playing');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        currentUtterance = new SpeechSynthesisUtterance(cleanForTTS(text));
        currentUtterance.lang = 'el-GR'; 
        currentUtterance.rate = getPlaybackRate();
        
        currentUtterance.onend = () => clearPlayingHighlight();
        window.speechSynthesis.speak(currentUtterance);
    }

    function playSelectedGroup() {
        stopPlayback();
        clearPlayingHighlight();
        
        const selectedRows = document.querySelectorAll('.selected-row');
        playQueue = [];
        
        selectedRows.forEach(row => {
            const id = parseInt(row.id.replace('row-', ''));
            const found = sentences.find(s => s.id === id);
            if (found) playQueue.push(found);
        });

        if (playQueue.length === 0) {
            alert("Please tap or click sentences to select them first.");
            return;
        }

        currentQueueIndex = 0;
        currentRepeatCount = 0; 
        playNextInQueue();
    }

    function playNextInQueue() {
        clearPlayingHighlight();

        if (currentQueueIndex >= playQueue.length) {
            if (document.getElementById('loopToggle').checked) {
                currentQueueIndex = 0; 
                currentRepeatCount = 0;
            } else {
                return; 
            }
        }

        const currentItem = playQueue[currentQueueIndex];
        const targetRow = document.getElementById(`row-${currentItem.id}`);
        
        if (targetRow) {
            targetRow.classList.add('active-playing');
            if (currentRepeatCount === 0) {
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        currentUtterance = new SpeechSynthesisUtterance(cleanForTTS(currentItem.greek));
        currentUtterance.lang = 'el-GR';
        currentUtterance.rate = getPlaybackRate();
        
        currentUtterance.onend = () => {
            const sliderVal = parseInt(document.getElementById('repeatSlider').value);
            const targetRepeats =[sliderVal];
            
            currentRepeatCount++;

            if (currentRepeatCount >= targetRepeats) {
                currentQueueIndex++;
                currentRepeatCount = 0; 
            }

            const pauseTime = parseFloat(document.getElementById('delaySlider').value) * 1000;
            delayTimeout = setTimeout(() => {
                playNextInQueue();
            }, pauseTime);
        };
        
        window.speechSynthesis.speak(currentUtterance);
    }

    function stopPlayback() {
        window.speechSynthesis.cancel();
        clearTimeout(delayTimeout); 
        clearPlayingHighlight();
    }

    function clearPlayingHighlight() {
        document.querySelectorAll('.row').forEach(row => {
            row.classList.remove('active-playing');
        });
    }

    function toggleColumn(language) {
        const container = document.getElementById('listContainer');
        if (language === 'english') {
            container.classList.toggle('hide-english');
            const btn = document.getElementById('toggleEn');
            btn.classList.toggle('off');
            btn.textContent = container.classList.contains('hide-english') ? "English OFF" : "English ON";
        } else if (language === 'greek') {
            container.classList.toggle('hide-greek');
            const btn = document.getElementById('toggleEl');
            btn.classList.toggle('off');
            btn.textContent = container.classList.contains('hide-greek') ? "Greek OFF" : "Greek ON";
        }
    }
</script>
</body>
</html>
